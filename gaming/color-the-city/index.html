<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Colore la ville · Adaptatech</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <section id="menu" class="menu-screen" aria-labelledby="game-title">
    <div class="menu-card">
      <img class="menu-art" src="../../images/color-the-city.svg" alt="" width="800" height="500">
      <h1 id="game-title" data-i18n="title">Colore la ville.</h1>
      <p class="menu-copy" data-i18n="readyCopy">Une pression, une goutte de couleur.</p>
      <button id="mainAction" class="paint-button" type="button" autofocus><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2C9 8 3 14 3 19a9 9 0 0 0 18 0C21 14 15 8 12 2Z" fill="currentColor"/></svg><span id="actionLabel">C’est parti !</span></button>
      <p class="menu-hint" data-i18n="menuHint">Espace ou Entrée · switch · clic · toucher. Échap pour revenir au menu.</p>
      <details class="menu-options" id="options">
        <summary data-i18n="settings">Réglages</summary>
        <div class="options-grid">
          <label class="setting"><span data-i18n="language">Langue</span><select id="language"><option value="fr">Français</option><option value="en">English</option><option value="ja">日本語</option></select></label>
          <label class="setting"><span data-i18n="speed">Vitesse du zeppelin</span><select id="speed"><option value="45" data-i18n="slow">Douce</option><option value="75" selected data-i18n="normal">Tranquille</option><option value="120" data-i18n="fast">Rapide</option></select></label>
          <label class="setting"><span data-i18n="guide">Guide de visée</span><input id="guide" type="checkbox"></label>
          <label class="setting"><span data-i18n="assist">Coup de pouce</span><input id="assist" type="checkbox" checked></label>
          <label class="setting"><span data-i18n="soundLabel">Petits sons</span><input id="sound" type="checkbox"></label>
        </div>
      </details>
      <a class="back-link" href="../index.html" data-i18n="games">Jeux pour switch</a>
    </div>
  </section>
  <main id="game" hidden>
    <div class="drawing-board" id="playSurface" data-state="ready" tabindex="0" role="button" aria-label="Lâcher une goutte de peinture">
      <svg id="scene" viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-description">
        <title id="scene-title">Colore la ville</title>
        <desc id="scene-description">Un grand zeppelin survole quatre maisons blanches. Appuie pour peindre un étage.</desc>
        <defs id="paintDefs"></defs>
        <rect width="1200" height="720" fill="#fff"/>
        <g id="streetDetails" aria-hidden="true"></g>
        <g id="buildings"></g>
        <line id="aimGuide" x1="170" x2="170" y1="282" y2="650" stroke="#a9a6b4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12"/>
        <ellipse id="aimMark" cx="170" cy="650" rx="14" ry="4" fill="#c5bdd9"/>
        <g id="airship" transform="translate(239 112)" aria-hidden="true" stroke="#45404f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- A big, friendly paint-carrying zeppelin. Its drop outlet is at x=0. -->
          <path d="M-148-19-221-57-208-4-159 9" fill="#b8a5e8"/>
          <path d="M-158 18-215 59-203 13-163-4" fill="#97d9c7"/>
          <path d="M-183-2C-172-80-22-100 96-66C141-53 176-27 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="#fff0ac"/>
          <path d="M-183-2C-164-58-30-71 91-45C135-36 166-21 185-3C155-14 132-21 91-25C-27-40-140-35-183-2Z" fill="#ffbbad" stroke="none"/>
          <path d="M-183-2C-140 18-22 31 91 18C134 13 164 5 185-3C166 24 126 51 48 60C-64 72-165 40-183-2Z" fill="#bca9ec" stroke="none"/>
          <path d="M-183-2C-148 46-27 62 91 40C134 32 164 15 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="#9edcc8" stroke="none"/>
          <path d="M-183-2C-172-80-22-100 96-66C141-53 176-27 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="none"/>
          <path d="M-175-3C-108-25 86-24 175-3M-167 18C-82 49 76 46 165 14M-164-24C-77-66 73-55 160-23" fill="none" stroke-width="1.8" opacity=".7"/>
          <path d="M-79 63-61 99M51 69 35 99" fill="none"/>
          <path d="M-74 98H52L39 131H-49Q-66 129-74 98Z" fill="#ffe18a"/>
          <path d="M-74 98H52" stroke-width="5"/>
          <g fill="#fff"><circle cx="-43" cy="112" r="7"/><circle cx="-14" cy="112" r="7"/><circle cx="15" cy="112" r="7"/></g>
          <path d="M-74 112h-31V92h-21M-123 77-126 108M-137 92h27" fill="none" stroke-width="2.5"/><ellipse cx="-126" cy="92" rx="8" ry="16" fill="#fff"/>
          <path d="M-13 132h26v14q-13 6-26 0Z" id="paintBucket" fill="#ffb39e"/>
          <path d="M-8 142h3" stroke="#fff" stroke-width="3"/>
          <path d="M-147-34q9-8 18-4" fill="none" stroke="#fff" stroke-width="6"/>
        </g>
        <g id="drops"></g>
        <g id="effects" aria-hidden="true"></g>
      </svg>
    </div>
  </main>
  <progress id="progress" class="sr-only" value="0" max="12" aria-label="Étages peints"></progress>
  <p id="feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p>Active JavaScript pour jouer. / Enable JavaScript to play.</p></noscript>
</body>
</html>
