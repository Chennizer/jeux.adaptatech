<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Constellations calmes</title>
  <link rel="stylesheet" href="../../css/global.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: Arial, sans-serif; background:#040816; color:#eaf1ff; }
    .top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px; background:#0b1530; position:sticky; top:0; z-index:2; }
    .top label { font-size:14px; display:flex; gap:6px; align-items:center; }
    button,input,select { font-size:14px; }
    #sky { display:block; width:100vw; height:calc(100vh - 70px); cursor:none; }
  </style>
</head>
<body>
  <div class="top">
    <a href="../index.html">← Eyegaze</a>
    <label>Vitesse <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"></label>
    <label>Taille étoiles <input id="size" type="range" min="1" max="4" step="0.5" value="2"></label>
    <label><input id="motion" type="checkbox"> Réduire mouvements</label>
    <label><input id="mute" type="checkbox"> Muet</label>
    <button id="clearBtn">Effacer</button>
  </div>
  <canvas id="sky"></canvas>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const stars = [];
const links = [];
const pointer = {x: 0, y: 0, active: false};
let lastNear = null;

const speedEl = document.getElementById('speed');
const sizeEl = document.getElementById('size');
const motionEl = document.getElementById('motion');
const muteEl = document.getElementById('mute');

document.getElementById('clearBtn').addEventListener('click', ()=> { links.length=0; for (const s of stars) s.glow=0; });

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight - document.querySelector('.top').offsetHeight; }
addEventListener('resize', resize); resize();

function buildStars() {
  stars.length = 0;
  const count = Math.floor((canvas.width * canvas.height) / 22000);
  for (let i=0;i<count;i++) {
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: (0.8 + Math.random()*1.8),
      tw: Math.random()*Math.PI*2,
      glow: 0
    });
  }
}
buildStars();

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = e.clientX - rect.left;
  pointer.y = e.clientY - rect.top;
  pointer.active = true;
});

function nearestStar() {
  let best = null, bestD = 120;
  for (const s of stars) {
    const d = Math.hypot(pointer.x - s.x, pointer.y - s.y);
    if (d < bestD) { best = s; bestD = d; }
  }
  return best;
}

function chime(freq=660){
  if (muteEl.checked) return;
  const ac = chime.ac || (chime.ac = new (window.AudioContext||window.webkitAudioContext)());
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(ac.destination);
  const t = ac.currentTime;
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.start(); o.stop(t + 0.35);
}

function draw(t){
  const spd = Number(speedEl.value);
  ctx.fillStyle = '#040816';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (const l of links) {
    l.life -= 0.005 * spd;
    if (l.life <= 0) continue;
    ctx.strokeStyle = `rgba(160,210,255,${l.life})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y);
    ctx.lineTo(l.b.x, l.b.y);
    ctx.stroke();
  }

  for (const s of stars) {
    const tw = motionEl.checked ? 0.4 : (0.6 + Math.sin(t*0.001 + s.tw) * 0.4);
    s.glow = Math.max(0, s.glow - 0.01*spd);
    const base = s.r * Number(sizeEl.value);
    const rr = base + tw + s.glow * 4;
    ctx.fillStyle = `rgba(210,230,255,${0.75 + s.glow*0.2})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,rr,0,Math.PI*2);
    ctx.fill();
  }

  if (pointer.active) {
    const n = nearestStar();
    if (n && n !== lastNear) {
      n.glow = 1;
      if (lastNear) {
        links.push({a:lastNear,b:n,life:1});
        chime(520 + Math.random()*260);
      }
      lastNear = n;
      if (links.length > 120) links.splice(0, links.length-120);
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
