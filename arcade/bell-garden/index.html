<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="De grandes fleurs colorées à faire chanter au toucher, au regard ou avec une switch.">
  <title>Jardin de clochettes · Adaptatech</title>
  <link rel="icon" href="../../favicon.ico">
  <link rel="stylesheet" href="../../css/control-panel.css">
  <link rel="stylesheet" href="../../css/games.css">
  <link rel="stylesheet" href="../../css/video-stop-action.css">
  <link rel="stylesheet" href="garden.css">
  <script src="garden-art.js" defer></script>
  <script src="garden-music.js" defer></script>
  <script src="garden.js" defer></script>
</head>
<body class="video-stop-action-page bell-garden-page" data-theme="sky" style="--menu-side-image: url('../../images/arcade/bell-garden.svg');">
  <button id="language-toggle" type="button" aria-label="Changer la langue">EN</button>

  <section id="control-panel" aria-labelledby="options-main-title">
    <div id="control-panel-options" class="control-panel-options">
      <div class="game-menu-layout stop-action-menu-layout">
        <div class="game-menu-main">
          <div class="garden-menu-content">
            <div id="options-title-bar">
              <h1 id="options-arcade-title">Arcade</h1>
              <h2 id="options-main-title" data-i18n="title">Jardin de clochettes</h2>
            </div>
            <p id="control-panel-instructions" class="control-panel-instructions" data-i18n="instructions">Faites chanter les fleurs au toucher, au regard ou avec une switch.</p>

            <div id="options-inline-container" class="stop-action-options-inline-container">
              <div class="option-item stop-action-mode-card">
                <p id="input-label" class="stop-action-mode-description" data-i18n="inputMode">Type de contrôle</p>
                <div id="input-mode-segmented-control" role="group" aria-labelledby="input-label">
                  <button id="mode-tap" type="button" class="stop-action-mode-btn input-mode-btn selected" data-input-mode="tap" data-i18n="tapMode" aria-pressed="true">Tactile</button>
                  <button id="mode-gaze" type="button" class="stop-action-mode-btn input-mode-btn" data-input-mode="gaze" data-i18n="gazeMode" aria-pressed="false">Regard</button>
                  <button id="mode-switch" type="button" class="stop-action-mode-btn input-mode-btn" data-input-mode="switch" data-i18n="switchMode" aria-pressed="false">Switch</button>
                </div>
              </div>
              <div class="music-switch">
                <label for="music-enabled"><span data-i18n="music">Musique</span><input id="music-enabled" type="checkbox" role="switch" checked></label>
              </div>
            </div>
            <details id="advanced-options" class="garden-advanced">
              <summary data-i18n="options">Options</summary>
              <div class="advanced-fields">
                <p id="mode-description" class="stop-action-mode-description"></p>
                <div id="switch-field" class="option-item" hidden>
                  <label for="switch-mode" class="teal-label" data-i18n="switchType">Mode switch</label>
                  <select id="switch-mode" class="styled-select">
                    <option value="scan" data-i18n="scanMode">Une switch : balayage</option>
                    <option value="step" data-i18n="stepMode">Deux switches : avancer / jouer</option>
                  </select>
                </div>
                <div id="dwell-field" class="option-item" hidden>
                  <label for="dwell-time" class="teal-label"><span data-i18n="dwellTime">Temps de fixation</span> <output id="dwell-value" for="dwell-time">800 ms</output></label>
                  <input id="dwell-time" class="styled-slider" type="range" min="300" max="2500" step="100" value="800">
                </div>
                <div id="scan-field" class="option-item" hidden>
                  <label for="scan-time" class="teal-label"><span data-i18n="scanTime">Intervalle de balayage</span> <output id="scan-value" for="scan-time">1,5 s</output></label>
                  <input id="scan-time" class="styled-slider" type="range" min="600" max="4000" step="100" value="1500">
                </div>
                <div class="option-item">
                  <label for="theme" class="teal-label" data-i18n="background">Fond</label>
                  <select id="theme" class="styled-select">
                    <option value="sky" data-i18n="skyTheme">Jardin</option>
                    <option value="dark" data-i18n="darkTheme">Noir</option>
                    <option value="light" data-i18n="lightTheme">Blanc</option>
                  </select>
                </div>
                <div class="option-item">
                  <label class="teal-label" for="music-volume"><span data-i18n="musicVolume">Volume de la musique</span> <output id="music-volume-value" for="music-volume">10 %</output></label>
                  <input id="music-volume" class="styled-slider" type="range" min="0" max="100" step="5" value="10">
                </div>
                <div class="option-item">
                  <label class="teal-label" for="volume"><span data-i18n="volume">Volume des fleurs</span> <output id="volume-value" for="volume">55 %</output></label>
                  <input id="volume" class="styled-slider" type="range" min="0" max="100" step="5" value="55">
                </div>
                <label class="garden-checkbox" for="mute-toggle"><input id="mute-toggle" type="checkbox"><span data-i18n="mute">Couper les clochettes</span></label>
                <label class="garden-checkbox" for="gentle-effects"><input id="gentle-effects" type="checkbox"><span data-i18n="gentleEffects">Réduire les animations</span></label>
                <label class="garden-checkbox" for="fullscreen-toggle"><input id="fullscreen-toggle" type="checkbox" checked><span data-i18n="fullscreen">Plein écran</span></label>
              </div>
            </details>
            <p id="audio-notice" role="status" data-i18n="soundUnavailable" hidden>Le son n’a pas pu démarrer. Appuyez sur Commencer pour réessayer.</p>
            <p id="music-notice" role="status" data-i18n="musicUnavailable" hidden>La musique n’a pas pu démarrer. Réessayez en appuyant sur Commencer.</p>
            <div id="button-container" class="button-container stop-action-button-container">
              <button id="control-panel-start-button" class="button" type="button" data-i18n="start">Commencer</button>
              <a class="garden-back" href="../index.html" data-i18n="backToArcade">Retour à l’arcade</a>
            </div>
          </div>
        </div>
        <aside class="game-menu-art" aria-hidden="true">
          <div class="game-menu-art-card"><div class="game-menu-art-image"></div></div>
        </aside>
      </div>
    </div>
  </section>

  <main id="game-screen" hidden>
    <svg class="garden-sky" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <defs>
        <linearGradient id="garden-sky-wash" x2="0" y2="1"><stop stop-color="#66c8f6"/><stop offset=".6" stop-color="#bdf0ff"/><stop offset="1" stop-color="#fff4b8"/></linearGradient>
        <radialGradient id="garden-sun-glow"><stop stop-color="#fff0a1" stop-opacity=".8"/><stop offset="1" stop-color="#fff0a1" stop-opacity="0"/></radialGradient>
      </defs>
      <path fill="url(#garden-sky-wash)" d="M0 0H1600V900H0Z"/>
      <g class="garden-sun">
        <circle cx="1358" cy="155" r="265" fill="url(#garden-sun-glow)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(0 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(30 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(60 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(90 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(120 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(150 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(180 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(210 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(240 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(270 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(300 1358 155)"/>
        <ellipse cx="1358" cy="44" rx="8" ry="20" fill="#ffd65a" transform="rotate(330 1358 155)"/>
        <circle cx="1358" cy="155" r="76" fill="#ffe36a" stroke="#ffcf48" stroke-width="3"/>
        <path d="M1311 144A50 50 0 0 1 1360 105" fill="none" stroke="#fff5bd" stroke-width="10" stroke-linecap="round"/>
      </g>
      <g class="garden-cloud garden-cloud--one" fill="#fffdf2" opacity=".75">
        <path d="M117 160C95 139 118 112 144 117C146 78 193 66 213 98C240 71 279 90 281 118C310 103 343 128 332 150C358 144 375 163 360 176H126Z"/>
        <path d="M330 215C314 201 328 183 347 188C357 159 386 161 395 184C420 171 443 190 437 206C460 199 470 217 452 225H340Z" opacity=".45"/>
      </g>
      <g class="garden-cloud garden-cloud--two" fill="#fffdf2" opacity=".55">
        <path d="M773 122C753 108 767 84 791 89C797 59 833 51 850 78C878 60 909 80 906 102C934 94 955 113 940 129H784Z"/>
      </g>
    </svg>
    <picture class="garden-meadow" aria-hidden="true">
      <source media="(max-aspect-ratio: 1/1)" srcset="../../images/arcade/bell-garden-meadow-portrait.svg">
      <img src="../../images/arcade/bell-garden-meadow.svg" alt="">
    </picture>
    <div class="bird-flight bird-flight--near" aria-hidden="true">
      <svg class="garden-bird" viewBox="0 0 80 46"><path class="bird-wing" d="M39 27C25 11 13 8 3 13C14 17 25 25 39 27C51 9 64 3 77 7C63 13 54 23 39 27Z"/><path d="M23 30Q40 20 52 28L64 27L57 31Q43 39 34 33L21 37Z"/></svg>
      <svg class="garden-bird garden-bird--second" viewBox="0 0 80 46"><path class="bird-wing" d="M39 27C25 11 13 8 3 13C14 17 25 25 39 27C51 9 64 3 77 7C63 13 54 23 39 27Z"/><path d="M23 30Q40 20 52 28L64 27L57 31Q43 39 34 33L21 37Z"/></svg>
    </div>
    <div class="bird-flight bird-flight--far" aria-hidden="true">
      <svg class="garden-bird" viewBox="0 0 80 46"><path class="bird-wing" d="M39 27C25 11 13 8 3 13C14 17 25 25 39 27C51 9 64 3 77 7C63 13 54 23 39 27Z"/><path d="M23 30Q40 20 52 28L64 27L57 31Q43 39 34 33L21 37Z"/></svg>
    </div>
    <div id="garden" role="group" tabindex="-1" aria-label="Fleurs musicales" aria-describedby="play-hint"></div>
    <p id="play-hint" class="sr-only"></p>
    <p id="audio-status" class="sr-only" role="status"></p>
    <p id="music-status" class="sr-only" role="status"></p>
    <button id="settings-button" class="garden-settings" type="button" aria-label="Options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.5-2.3 1L4 6.8l-1.3 2.4 1.8 1.8v2l-1.8 1.8L4 17.2l2.5-.7 2.3 1 .7 2.5h3l.7-2.5 2.3-1 2.5.7 1.3-2.4-1.8-1.8v-2l1.8-1.8L18 6.8l-2.5.7-2.3-1L12.5 3Z"/><circle cx="11" cy="11.5" r="3"/></svg>
    </button>
  </main>
  <audio id="garden-music" src="../../songs/zenitude/v5calmmusic1.mp3" preload="none" hidden></audio>
  <noscript><p class="no-script">Ce jeu a besoin de JavaScript. / This game needs JavaScript. / JavaScriptを有効にしてください。</p></noscript>
</body>
</html>
