<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-fr="Choix de mots" data-en="Word Choices" data-ja="ことばを選ぶ">Choix de mots</title>
  <link rel="stylesheet" href="../../css/games.css">
  <link rel="stylesheet" href="../../css/choiceeyegaze.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../../js/eyegaze-menu.js" defer></script>
  <script src="../../js/translationmain.js" defer></script>
  <script src="wordchoices.js" defer></script>
</head>
<body>
  <main id="game-options" class="modal word-options" aria-labelledby="options-main-title">
    <button id="langToggle" type="button" aria-label="Changer de langue">EN</button>

    <div id="options-title-bar">
      <h1 id="options-main-title" data-fr="Choix de mots" data-en="Word Choices" data-ja="ことばを選ぶ">Choix de mots</h1>
    </div>

    <form id="control-panel-options">
      <div id="options-inline-container">
        <div class="options-column">
          <div class="option-item">
            <label for="wordCount" class="teal-label">
              <span data-fr="Nombre de choix" data-en="Number of choices" data-ja="選択肢の数">Nombre de choix</span>
              <span id="wordCountVal">2</span>
            </label>
            <input type="range" id="wordCount" class="styled-slider" min="1" max="9" value="2">
          </div>
          <div id="word-fields"></div>
        </div>

        <div class="options-column">
          <div class="option-item">
            <label for="tileSize" class="teal-label">
              <span data-fr="Taille des cases" data-en="Tile size" data-ja="タイルの大きさ">Taille des cases</span>
              <span><span id="tileSizeVal">75</span>%</span>
            </label>
            <input type="range" id="tileSize" class="styled-slider" min="40" max="100" step="5" value="75">
          </div>

          <div class="option-item">
            <label for="themeSelect" class="teal-label label-block"
                   data-fr="Thème" data-en="Theme" data-ja="テーマ">Thème</label>
            <select id="themeSelect" class="styled-select">
              <option value="light" data-fr="Clair" data-en="Light" data-ja="ライト">Clair</option>
              <option value="dark" data-fr="Sombre" data-en="Dark" data-ja="ダーク">Sombre</option>
            </select>
          </div>

          <div class="option-item">
            <label class="teal-label">
              <input type="checkbox" id="ttsEnabled" checked>
              <span data-fr="Lire le choix à voix haute" data-en="Read the choice aloud" data-ja="選択したことばを読み上げる">Lire le choix à voix haute</span>
            </label>
          </div>
        </div>

        <div class="options-column">
          <div class="option-item">
            <label for="dwellTimeSlider" class="teal-label">
              <span data-fr="Temps de fixation" data-en="Dwell time" data-ja="注視時間">Temps de fixation</span>
              <span><span id="dwellTimeVal">1500</span> ms</span>
            </label>
            <input type="range" id="dwellTimeSlider" class="styled-slider" min="500" max="5000" step="100" value="1500">
          </div>

          <div class="option-item gp-compact">
            <label class="teal-label">
              <input type="checkbox" id="showGazePointer" checked>
              <span data-fr="Afficher le pointeur de regard" data-en="Show gaze pointer" data-ja="視線ポインターを表示">Afficher le pointeur de regard</span>
            </label>

            <details id="gpDetails">
              <summary class="gp-summary" data-fr="Options du pointeur" data-en="Pointer options" data-ja="ポインター設定">Options du pointeur</summary>
              <div class="gp-advanced">
                <div>
                  <label for="gazeSize" class="teal-label">
                    <span data-fr="Taille" data-en="Size" data-ja="サイズ">Taille</span>
                    <span><span id="gazeSizeVal">36</span> px</span>
                  </label>
                  <input type="range" id="gazeSize" class="styled-slider" min="16" max="100" step="2" value="36">
                </div>
                <div>
                  <label for="gazeOpacity" class="teal-label">
                    <span data-fr="Opacité" data-en="Opacity" data-ja="不透明度">Opacité</span>
                    <span><span id="gazeOpacityVal">100</span>%</span>
                  </label>
                  <input type="range" id="gazeOpacity" class="styled-slider" min="20" max="100" step="5" value="100">
                </div>
              </div>
            </details>
          </div>
        </div>
      </div>

      <div id="mode-divider" aria-hidden="true"></div>
      <button id="startButton" type="submit" class="button" data-fr="Commencer" data-en="Start" data-ja="開始">Commencer</button>
      <a class="back-to-eyegaze" href="../index.html" data-fr="Retour au contrôle oculaire" data-en="Back to Eye Gaze" data-ja="視線入力ゲームに戻る">Retour au contrôle oculaire</a>
    </form>
  </main>

  <main id="word-board" tabindex="-1" hidden>
    <header class="word-board-toolbar">
      <div class="word-status" role="status">
        <span id="board-selection" hidden>
          <span data-fr="Dernier choix" data-en="Last choice" data-ja="最後の選択">Dernier choix</span>
          <bdi id="selected-word"></bdi>
        </span>
      </div>
      <button id="edit-board" type="button" class="button"
              data-fr="Modifier les choix" data-en="Edit choices" data-ja="選択肢を編集">Modifier les choix</button>
    </header>
    <div class="word-grid-frame">
      <div id="word-grid"></div>
    </div>
  </main>

  <div id="gazePointer" aria-hidden="true"></div>
</body>
</html>
