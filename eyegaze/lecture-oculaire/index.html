<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecture au regard</title>
  <link rel="stylesheet" href="../../css/games.css" />
  <link rel="stylesheet" href="../../css/choiceeyegaze.css" />
  <link rel="stylesheet" href="../../css/lecture-oculaire.css" />
</head>
<body class="light">
  <div id="game-options" class="modal">
    <div id="options-title-bar">
      <h2 id="options-main-title">Lecture au regard</h2>
    </div>

    <div id="control-panel-options">
      <div id="mode-divider"></div>
      <div id="options-inline-container">
        <div class="options-column">
          <div class="option-item">
            <label for="lessonSelect" class="teal-label label-block">Leçon</label>
            <select id="lessonSelect" class="styled-select compact-field"></select>
          </div>
          <div class="option-item">
            <label class="teal-label">
              <input type="checkbox" id="showPrompt" checked />
              <span>Afficher la consigne</span>
            </label>
          </div>
        </div>

        <div class="options-column">
          <div class="option-item">
            <label for="choiceCount" class="teal-label label-block">Nombre de choix</label>
            <select id="choiceCount" class="styled-select compact-field">
              <option value="2">2 choix</option>
              <option value="3">3 choix</option>
              <option value="4">4 choix</option>
            </select>
          </div>
          <div class="option-item">
            <label class="teal-label">
              <input type="checkbox" id="autoNext" checked />
              <span>Avancer automatiquement</span>
            </label>
          </div>
        </div>

        <div class="options-column">
          <div class="option-item">
            <label for="dwellTimeSlider" class="teal-label">
              <span>Temps de fixation :</span>
              <span id="dwellTimeVal">1500</span> ms
            </label>
            <input type="range" id="dwellTimeSlider" class="styled-slider" min="500" max="5000" step="100" value="1500" />
          </div>
          <div class="option-item gp-compact">
            <label class="teal-label">
              <input type="checkbox" id="showGazePointer" checked />
              <span>Afficher le pointeur</span>
            </label>
          </div>
        </div>
      </div>

      <div id="mode-divider"></div>
      <button id="startButton" class="button">Commencer</button>
      <a class="button secondary-link" href="../index.html">Retour</a>
      <button id="exportJson" class="button secondary-link" type="button">Exporter le journal</button>
    </div>
  </div>

  <div class="game-container" aria-live="polite">
    <div id="topStrip" class="top-strip">
      <h2 id="prompt"><span id="promptText" class="prompt-text">Trouve</span><br><span class="target-letter"></span></h2>
    </div>
    <div class="grid-outer">
      <div id="choiceGrid" class="letter-grid"></div>
    </div>
  </div>

  <div id="gazePointer" aria-hidden="true"></div>

  <script src="../../js/eyegaze-menu.js"></script>
  <script src="../../js/lectureOculaireLessons.js"></script>
  <script src="../../js/lectureOculaire.js"></script>
</body>
</html>
