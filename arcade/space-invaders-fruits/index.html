<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title class="translate" data-fr="Arcade : Fruits de l'espace" data-en="Arcade: Space Fruit Blaster" data-ja="アーケード：スペースフルーツブラスター">Arcade: Space Fruit Blaster</title>
  <link rel="stylesheet" href="../../css/control-panel.css">
  <link rel="stylesheet" href="../../css/games.css">
  <link rel="stylesheet" href="../../css/gaming.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/video-stop-action.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B45TJG4GBJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'G-B45TJG4GBJ');
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game-container { position: fixed; inset: 0; display: none; }
    #game-canvas { width: 100%; height: 100%; display: block; }

    .hud {
      position: fixed;
      right: 18px;
      bottom: 20px;
      z-index: 30;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      line-height: 1.7;
      display: none;
      text-align: right;
    }
    .ammo-meter {
      position: fixed;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      z-index: 32;
    }
    .ammo-meter-track {
      width: 72px;
      height: 260px;
      margin: 0 auto;
      border: 2px solid rgba(220, 255, 255, 0.85);
      border-radius: 16px;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to top,
          rgba(255,255,255,0.12) 0 10%,
          rgba(255,255,255,0.03) 10% 20%
        ),
        rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .ammo-meter-track::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.45);
    }
    .ammo-meter-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      width: 100%;
      background: hsl(120 85% 52%);
      box-shadow: 0 0 14px rgba(120, 255, 140, 0.6);
      transition: height 80ms linear, background 120ms linear, box-shadow 120ms linear;
    }

    #game-over {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 35;
      background: rgba(0,0,0,0.5);
    }

    #game-over .results-panel {
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      max-width: min(90vw, 680px);
    }

    #game-over-score {
      color: #fff;
      margin: 18px 0;
      font-size: 16px;
      line-height: 1.6;
    }
    .retry-hint {
      color: #fff;
      margin: 12px 0 6px;
      font-size: 12px;
      line-height: 1.5;
    }
    #retry-eyegaze-tile {
      width: min(42vw, 320px);
      aspect-ratio: 1 / 1;
      margin: 12px auto 0;
      border: 4px solid rgba(255,255,255,0.75);
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      position: relative;
      display: none;
      overflow: hidden;
    }
    #retry-eyegaze-tile img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    #retry-eyegaze-fill {
      position: absolute;
      inset: 0;
      background: rgba(255, 52, 52, 0.42);
      transform: scale(0);
      transform-origin: center;
      pointer-events: none;
    }
  </style>
</head>
<body
  class="video-stop-action-page"

>

  <script src="../../js/translationmain.js"></script>
  <script>
    (() => {
      const controlPanel = document.getElementById('control-panel');
      const startButton = document.getElementById('control-panel-start-button');
      const gameContainer = document.getElementById('game-container');
      const hud = document.getElementById('hud');
      const gameOverScreen = document.getElementById('game-over');
      const restartButton = document.getElementById('continue-button');
      const retryHint = document.getElementById('retry-hint');
      const retryEyegazeTile = document.getElementById('retry-eyegaze-tile');
      const retryEyegazeFill = document.getElementById('retry-eyegaze-fill');
      const music = document.getElementById('bg-music');
      const languageToggleButton = document.getElementById('language-toggle');

      const scoreNode = document.getElementById('hud-score');
      const livesNode = document.getElementById('hud-lives');
      const gameOverScore = document.getElementById('game-over-score');
      const ammoMeter = document.getElementById('ammo-meter');
      const ammoMeterFill = document.getElementById('ammo-meter-fill');

      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d');

      const enemySprites = [];
      const fruitPaths = [
        '../../images/pictos/apple.png',
        '../../images/pictos/orange.png',
        '../../images/pictos/banana.png',
        '../../images/pictos/strawberry.png',
        '../../images/pictos/kiwi.png',
        '../../images/pictos/grapes.png',
        '../../images/pictos/lemon.png',
        '../../images/pictos/pineapple.png'
      ];

      let inputMode = 'switch';
      let difficulty = 'normal';
      let running = false;
      let rafId = null;
      let score = 0;
      let lives = 3;
      let enemySpawnTimer = 0;
      let currentSpawnDelay = 10000;
      let lastTs = 0;
      let motionTime = 0;
      let ammoEnergy = 1;
      let gazeX = window.innerWidth * 0.5;
      let gazeY = window.innerHeight * 0.5;
      let hoveredEnemyId = null;
      let hoverStartAt = 0;
      let shieldFlashUntil = 0;
      let projectileFlashUntil = 0;
      let retryHoverStartAt = 0;
      let retryRafId = null;
      const EYEGAZE_DWELL_MS = 1000;
      const EYEGAZE_ROW_STEP_MS = 10000;
      const EYEGAZE_ROW_TRANSITION_MS = 2000;
      const EYEGAZE_ROW_GAP_PX = 24;
      const EYEGAZE_DANGER_HOLD_MS = 4000;
      const EYEGAZE_ATTACK_RISE_SPEED = 220;
      const EYEGAZE_ATTACK_SHAKE_MS = 320;
      const EYEGAZE_SHIELD_FLASH_MS = 450;

      const stars = [];
      const bullets = [];
      const enemies = [];
      const fxBursts = [];
      let nextEnemyId = 1;
      const STAR_COUNT = 220;
      let sfxCtx = null;

      const player = {
        x: 0,
        y: 0,
        width: 72,
        height: 28,
        cooldown: 0
      };

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.y = canvas.height - 90;
        if (player.x === 0) player.x = canvas.width * 0.5;
      }

      function makeStars() {
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i += 1) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * 1,
            size: 1 + Math.random() * 2.5
          });
        }
      }

      function updateStars(dt) {
        const speed = 160;
        for (const star of stars) {
          star.y += speed * (0.35 + star.z) * dt;
          if (star.y > canvas.height + 4) {
            star.y = -8;
            star.x = Math.random() * canvas.width;
            star.z = Math.random();
            star.size = 1 + Math.random() * 2.5;
          }
        }
      }

      function drawStars() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const star of stars) {
          const alpha = 0.35 + star.z * 0.65;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
      }

      function loadSprites() {
        fruitPaths.forEach((path) => {
          const img = new Image();
          img.src = path;
          enemySprites.push(img);
        });
      }

      function spawnEnemy() {
        const image = enemySprites[Math.floor(Math.random() * enemySprites.length)] || null;
        const size = 48;
        if (inputMode === 'eyegaze') {
          const tileSize = getEyegazeTileSize();
          const availableLanes = getAvailableEyegazeLanes();
          if (!availableLanes.length) return;
          const lane = availableLanes[Math.floor(Math.random() * availableLanes.length)];
          const rowY = getEyegazeRowY(0);
          enemies.push({
            id: nextEnemyId++,
            x: window.innerWidth * lane,
            y: rowY,
            size: tileSize,
            speed: 0,
            image,
            type: 'normal',
            hp: 1,
            eyegazeTile: true,
            resolved: false,
            spawnAt: performance.now(),
            lane,
            introMs: getEyegazeIntroDurationMs(tileSize)
          });
          return;
        }

        const isTank = (difficulty === 'hard' && Math.random() < 0.35)
          || (difficulty === 'competitive' && Math.random() < 0.5);
        const baseSpeed = 58;
        const speedMultiplier = difficulty === 'competitive' ? 1.5 : difficulty === 'hard' ? 1.25 : 1;
        const switchSize = size * 3;
        const leftSafeZone = canvas.width * 0.1; // keep left 1/10 clear for UI (ammo column)
        const minX = Math.max(leftSafeZone + switchSize * 0.5, 30 + switchSize * 0.5);
        const maxX = Math.max(minX, canvas.width - Math.max(60, switchSize * 0.5 + 20));
        enemies.push({
          id: nextEnemyId++,
          x: minX + Math.random() * Math.max(0, maxX - minX),
          y: 70,
          size: switchSize,
          speed: baseSpeed * speedMultiplier,
          image,
          type: isTank ? 'tank' : 'normal',
          hp: isTank ? 2 : 1
        });
      }

      function getSpawnDelayMs() {
        if (difficulty === 'hard') return 5000 + Math.random() * 3000;       // 5 to 8 sec
        if (difficulty === 'competitive') return 3000 + Math.random() * 1000; // 3 to 4 sec
        return 10000; // normal
      }

      function shoot() {
        if (!running || player.cooldown > 0) return;
        if (inputMode === 'eyegaze') return;
        if (usesAmmoMeter()) {
          const cost = getShotCost();
          if (ammoEnergy < cost) return;
          ammoEnergy = Math.max(0, ammoEnergy - cost);
          updateAmmoMeter();
        }

        const muzzleX = player.x;
        const muzzleY = player.y - 16;
        const speed = 540;
        const target = findNearestEnemy(muzzleX, muzzleY);
        let vx = 0;
        let vy = -speed;
        let targetId = null;
        let homing = false;

        if (target) {
          targetId = target.id;
          homing = true;
          const arcDirection = target.x >= muzzleX ? 1 : -1;
          const launchAngle = (-Math.PI / 2) + arcDirection * 0.48;
          vx = Math.cos(launchAngle) * speed;
          vy = Math.sin(launchAngle) * speed;
        }

        bullets.push({
          x: muzzleX,
          y: muzzleY,
          vx,
          vy,
          speed,
          targetId,
          homing,
          turnRate: 3.2,
          r: 9,
          trail: []
        });
        playSfx('launch');
        player.cooldown = usesAmmoMeter() ? 0.12 : 1.0;
      }

      function updateGame(dt) {
        player.cooldown = Math.max(0, player.cooldown - dt);
        if (usesAmmoMeter()) {
          ammoEnergy = Math.min(1, ammoEnergy + getAmmoRegenPerSecond() * dt);
          updateAmmoMeter();
        }

        motionTime += dt;
        const centerX = canvas.width * 0.5;
        const horizontalRange = canvas.width / 12; // total sweep is 1/6th of the screen width
        player.x = inputMode === 'eyegaze'
          ? centerX
          : centerX + Math.sin(motionTime * 0.6) * horizontalRange;

        enemySpawnTimer += dt * 1000;
        if (enemySpawnTimer >= currentSpawnDelay) {
          enemySpawnTimer = 0;
          spawnEnemy();
          currentSpawnDelay = getSpawnDelayMs();
        }

        for (let i = bullets.length - 1; i >= 0; i -= 1) {
          const b = bullets[i];
          b.trail.unshift({ x: b.x, y: b.y, life: 0.45, r: b.r * (0.55 + Math.random() * 0.45) });
          if (b.trail.length > 14) b.trail.pop();
          for (const p of b.trail) p.life -= dt;
          b.trail = b.trail.filter((p) => p.life > 0);

          if (b.homing && b.targetId !== null) {
            const targetEnemy = findEnemyById(b.targetId);
            if (targetEnemy) {
              const desiredAngle = Math.atan2(targetEnemy.y - b.y, targetEnemy.x - b.x);
              const currentAngle = Math.atan2(b.vy, b.vx);
              let delta = desiredAngle - currentAngle;
              while (delta > Math.PI) delta -= Math.PI * 2;
              while (delta < -Math.PI) delta += Math.PI * 2;
              const maxTurn = b.turnRate * dt;
              const clampedTurn = Math.max(-maxTurn, Math.min(maxTurn, delta));
              const nextAngle = currentAngle + clampedTurn;
              b.vx = Math.cos(nextAngle) * b.speed;
              b.vy = Math.sin(nextAngle) * b.speed;
            }
          }

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.y < -20 || b.y > canvas.height + 20 || b.x < -20 || b.x > canvas.width + 20) bullets.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (e.eyegazeTile) {
            const now = performance.now();
            if (e.attackState === 'ascending') {
              const dangerY = getDangerLineY();
              e.y += EYEGAZE_ATTACK_RISE_SPEED * dt;
              const bottomEdge = e.y + e.size * 0.5;
              if (bottomEdge >= dangerY) {
                e.attackState = 'shaking';
                e.attackStartAt = now;
                e.y = dangerY - e.size * 0.5;
                shieldFlashUntil = now + EYEGAZE_SHIELD_FLASH_MS;
                lives -= 1;
                updateHud();
                if (lives <= 0) {
                  endGame();
                  return;
                }
              }
            } else if (e.attackState === 'shaking') {
              if (now - (e.attackStartAt || now) >= EYEGAZE_ATTACK_SHAKE_MS) {
                spawnEyegazeBottomBurst(e.x, getDangerLineY(), e.size * 1.05);
                enemies.splice(i, 1);
                continue;
              }
            } else {
              const elapsed = now - (e.spawnAt || 0);
              const animatedY = getEyegazeAnimatedY(elapsed);
              if (animatedY === null) {
                e.attackState = 'ascending';
                e.attackStartAt = now;
                continue;
              }
              const introDuration = Math.max(300, e.introMs || 300);
              const introT = Math.max(0, Math.min(1, elapsed / introDuration));
              const introStartY = -e.size;
              e.y = introStartY + (animatedY - introStartY) * introT;
            }
          } else {
            e.y += e.speed * dt;
            const dangerY = getDangerLineY();
            if (e.y + e.size * 0.5 >= dangerY) {
              spawnShieldContactBurst(e.x, dangerY, e.size);
              playSfx('shield');
              enemies.splice(i, 1);
              lives -= 1;
              updateHud();
              if (lives <= 0) {
                endGame();
                return;
              }
              continue;
            }
          }

          if (inputMode === 'eyegaze' && e.y - e.size * 0.5 > canvas.height) {
            enemies.splice(i, 1);
            lives -= 1;
            updateHud();
            if (lives <= 0) {
              endGame();
              return;
            }
            continue;
          }

          for (let j = bullets.length - 1; j >= 0; j -= 1) {
            const b = bullets[j];
            if (e.attackState) continue;
            if (b.targetId !== null && b.targetId !== e.id) continue;
            const dx = b.x - e.x;
            const dy = b.y - e.y;
            if ((dx * dx + dy * dy) <= ((e.size * 0.45) * (e.size * 0.45))) {
              bullets.splice(j, 1);
              playSfx('hit');
              if (e.eyegazeTile) {
                enemies.splice(i, 1);
                score += 10;
                spawnProjectileBurst(e.x, e.y, e.size);
                playSfx('destroy');
                updateHud();
                break;
              }
              e.hp -= 1;
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                score += e.type === 'tank' ? 20 : 10;
                spawnProjectileBurst(e.x, e.y, e.size);
                playSfx('destroy');
                updateHud();
              }
              break;
            }
          }
        }

        if (inputMode === 'eyegaze') {
          updateEyegazeDwell();
        }

        for (let i = fxBursts.length - 1; i >= 0; i -= 1) {
          const burst = fxBursts[i];
          burst.life -= dt;
          if (burst.type === 'ring') {
            const expandSpeed = (burst.maxR - burst.r) * 7.5;
            burst.r = Math.min(burst.maxR, burst.r + expandSpeed * dt);
          } else if (burst.type === 'particles') {
            const drag = typeof burst.drag === 'number' ? burst.drag : 0.985;
            for (const p of burst.particles) {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= drag;
              p.vy *= drag;
            }
          }
          if (burst.life <= 0) fxBursts.splice(i, 1);
        }
      }

      function getEyegazeRowY(rowIndex) {
        const size = getEyegazeTileSize();
        const fieldTop = canvas.height * 0.08;
        const rows = getEyegazeRowCount();
        const clampedRow = Math.max(0, Math.min(rows - 1, rowIndex));
        const topY = fieldTop;
        return topY + size * 0.5 + clampedRow * (size + EYEGAZE_ROW_GAP_PX);
      }

      function getEyegazeTileSize() {
        const cols = getEyegazeColumnLanes().length;
        const rows = getEyegazeRowCount();
        const byWidth = canvas.width * (cols === 2 ? 0.44 : 0.34);
        const fieldHeight = canvas.height * 0.62;
        const byHeight = (fieldHeight - EYEGAZE_ROW_GAP_PX * (rows - 1)) / rows;
        return Math.max(110, Math.min(byWidth, byHeight));
      }

      function getEyegazeIntroDurationMs(tileSize) {
        const rowDistance = Math.max(1, Math.abs(getEyegazeRowY(1) - getEyegazeRowY(0)));
        const pxPerMs = rowDistance / EYEGAZE_ROW_TRANSITION_MS; // match row transition speed
        const introDistance = getEyegazeRowY(0) + tileSize;
        return Math.max(400, introDistance / Math.max(0.01, pxPerMs));
      }

      function getAvailableEyegazeLanes() {
        const lanes = getEyegazeColumnLanes();
        const occupied = new Set();
        const topY = getEyegazeRowY(0);
        const nextRowY = getEyegazeRowY(1);
        const topRowCutoff = (topY + nextRowY) * 0.5;
        for (const enemy of enemies) {
          if (!enemy.eyegazeTile) continue;
          if (typeof enemy.lane !== 'number') continue;
          if (enemy.y <= topRowCutoff) {
            occupied.add(enemy.lane);
          }
        }
        return lanes.filter((lane) => !occupied.has(lane));
      }

      function getEyegazeAnimatedY(elapsedMs) {
        const top = getEyegazeRowY(0);
        const second = getEyegazeRowY(1);
        const isNormalGrid = difficulty === 'normal';

        if (isNormalGrid) {
          const bottomStartMs = EYEGAZE_ROW_STEP_MS + EYEGAZE_ROW_TRANSITION_MS;
          const bottomEndMs = bottomStartMs + EYEGAZE_DANGER_HOLD_MS;
          if (elapsedMs < EYEGAZE_ROW_STEP_MS) return top; // hold top row
          if (elapsedMs < EYEGAZE_ROW_STEP_MS + EYEGAZE_ROW_TRANSITION_MS) {
            const t = (elapsedMs - EYEGAZE_ROW_STEP_MS) / EYEGAZE_ROW_TRANSITION_MS;
            return top + (second - top) * t; // smooth top -> bottom (2-row mode)
          }
          if (elapsedMs < bottomEndMs) return second; // danger hold at bottom row
          return null;
        }

        const middle = second;
        const bottom = getEyegazeRowY(2);
        const bottomStartMs = EYEGAZE_ROW_STEP_MS * 2 + EYEGAZE_ROW_TRANSITION_MS;
        const bottomEndMs = bottomStartMs + EYEGAZE_DANGER_HOLD_MS;

        if (elapsedMs < EYEGAZE_ROW_STEP_MS) return top; // hold top row
        if (elapsedMs < EYEGAZE_ROW_STEP_MS + EYEGAZE_ROW_TRANSITION_MS) {
          const t = (elapsedMs - EYEGAZE_ROW_STEP_MS) / EYEGAZE_ROW_TRANSITION_MS;
          return top + (middle - top) * t; // smooth top -> middle
        }
        if (elapsedMs < EYEGAZE_ROW_STEP_MS * 2) return middle; // hold middle row
        if (elapsedMs < EYEGAZE_ROW_STEP_MS * 2 + EYEGAZE_ROW_TRANSITION_MS) {
          const t = (elapsedMs - EYEGAZE_ROW_STEP_MS * 2) / EYEGAZE_ROW_TRANSITION_MS;
          return middle + (bottom - middle) * t; // smooth middle -> bottom
        }
        if (elapsedMs < bottomEndMs) return bottom; // danger hold at bottom row
        return null; // disappear
      }

      function drawEyegazeDangerLine() {
        const y = getDangerLineY();
        ctx.save();
        const flashStrength = Math.max(0, Math.min(1, (shieldFlashUntil - performance.now()) / EYEGAZE_SHIELD_FLASH_MS));
        const redBoost = Math.round(120 * flashStrength);
        const gradient = ctx.createLinearGradient(0, y, canvas.width, y);
        gradient.addColorStop(0, `rgba(${120 + redBoost}, 190, 255, 0.05)`);
        gradient.addColorStop(0.5, `rgba(${120 + redBoost}, ${190 - redBoost * 0.4}, ${255 - redBoost * 0.6}, 0.95)`);
        gradient.addColorStop(1, `rgba(${120 + redBoost}, 190, 255, 0.05)`);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(12, y);
        ctx.lineTo(canvas.width - 12, y);
        ctx.stroke();

        const layerWidth = canvas.width - 24;
        const layerLeft = 12;
        const shieldDepth = 64;
        const shieldGrad = ctx.createLinearGradient(0, y, 0, y + shieldDepth);
        shieldGrad.addColorStop(0, 'rgba(130, 200, 255, 0.26)');
        shieldGrad.addColorStop(0.35, 'rgba(130, 200, 255, 0.14)');
        shieldGrad.addColorStop(1, 'rgba(130, 200, 255, 0)');
        ctx.fillStyle = shieldGrad;
        ctx.fillRect(layerLeft, y, layerWidth, shieldDepth);

        ctx.shadowColor = flashStrength > 0.01 ? 'rgba(255, 90, 90, 0.9)' : 'rgba(100, 180, 255, 0.9)';
        ctx.shadowBlur = 18 + flashStrength * 8;
        ctx.strokeStyle = flashStrength > 0.01 ? 'rgba(255, 130, 130, 0.7)' : 'rgba(135, 205, 255, 0.55)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(12, y);
        ctx.lineTo(canvas.width - 12, y);
        ctx.stroke();
        ctx.restore();
      }

      function getDangerLineY() {
        return getEyegazeRowY(getEyegazeRowCount() - 1) + getEyegazeTileSize() * 0.5 + 18;
      }

      function getEyegazeColumnLanes() {
        return difficulty === 'normal' ? [0.3, 0.7] : [0.16, 0.5, 0.84];
      }

      function getEyegazeRowCount() {
        return difficulty === 'normal' ? 2 : 3;
      }

      function drawPlayer() {
        const x = player.x;
        const y = player.y;

        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = '#21e0ff';
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(-22, 18);
        ctx.lineTo(22, 18);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#005d8e';
        ctx.fillRect(-34, 18, 68, 10);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-8, -3, 16, 8);

        ctx.restore();
      }

      function drawBullets() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const b of bullets) {
          const headR = b.r * 2.25;
          for (const p of b.trail) {
            const alpha = Math.max(0, p.life / 0.45);
            ctx.fillStyle = `rgba(255, 150, 60, ${0.26 * alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(1.4, p.r * (0.9 + alpha * 0.4)), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.shadowColor = 'rgba(255, 198, 80, 0.85)';
          ctx.shadowBlur = 24;
          ctx.fillStyle = '#ffd66b';
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.atan2(b.vy, b.vx));
          ctx.fillStyle = '#ffc24b';
          ctx.beginPath();
          ctx.moveTo(headR + 4, 0);
          ctx.lineTo(-headR * 0.8, -headR * 0.55);
          ctx.lineTo(-headR * 0.8, headR * 0.55);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fff4c4';
          ctx.beginPath();
          ctx.ellipse(-headR * 0.12, 0, headR * 0.44, headR * 0.26, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function findNearestEnemy(x, y) {
        if (!enemies.length) return null;
        let best = null;
        let bestDistSq = Infinity;
        for (const e of enemies) {
          const dx = e.x - x;
          const dy = e.y - y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDistSq) {
            bestDistSq = d2;
            best = e;
          }
        }
        return best;
      }

      function findEnemyById(id) {
        for (const enemy of enemies) {
          if (enemy.id === id) return enemy;
        }
        return null;
      }

      function drawEnemies() {
        for (const e of enemies) {
          if (e.eyegazeTile) {
            const shakeOffset = e.attackState === 'shaking'
              ? (Math.sin(performance.now() * 0.06) * 6)
              : 0;
            const renderX = e.x + shakeOffset;
            const x = renderX - e.size * 0.5;
            const y = e.y - e.size * 0.5;
            const hovered = !e.resolved && hoveredEnemyId === e.id;
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = 3;
            ctx.fillRect(x, y, e.size, e.size);
            ctx.strokeRect(x, y, e.size, e.size);

            if (e.image && e.image.complete) {
              ctx.drawImage(e.image, x + 6, y + 6, e.size - 12, e.size - 12);
            }

            if (e.resolved) {
              ctx.fillStyle = 'rgba(255, 52, 52, 0.42)';
              ctx.fillRect(x, y, e.size, e.size);
              ctx.strokeStyle = 'rgba(255, 120, 120, 0.8)';
              ctx.lineWidth = 2;
              ctx.strokeRect(x, y, e.size, e.size);
            } else if (hovered && hoverStartAt) {
              const progress = Math.max(0, Math.min(1, (performance.now() - hoverStartAt) / EYEGAZE_DWELL_MS));
              const fillW = e.size * progress;
              const fillH = e.size * progress;
              const fillX = e.x - fillW * 0.5;
              const fillY = e.y - fillH * 0.5;
              ctx.fillStyle = 'rgba(255, 52, 52, 0.42)';
              ctx.fillRect(fillX, fillY, fillW, fillH);
              ctx.strokeStyle = 'rgba(255, 120, 120, 0.8)';
              ctx.lineWidth = 2;
              ctx.strokeRect(fillX, fillY, fillW, fillH);
            }
            continue;
          }

          if (e.image && e.image.complete) {
            ctx.drawImage(e.image, e.x - e.size * 0.5, e.y - e.size * 0.5, e.size, e.size);
            if (e.type === 'tank') {
              ctx.strokeStyle = 'rgba(255, 110, 110, 0.95)';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(e.x, e.y, e.size * 0.38, 0, Math.PI * 2);
              ctx.stroke();
            }
          } else {
            ctx.fillStyle = '#ff3b6b';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawFxBursts() {
        for (const burst of fxBursts) {
          const alpha = Math.max(0, burst.life / burst.maxLife);
          if (burst.type === 'ring') {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = `rgba(255, 235, 170, ${0.65 * alpha})`;
            ctx.lineWidth = 3 + (1 - alpha) * 2;
            ctx.beginPath();
            ctx.arc(burst.x, burst.y, burst.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (burst.type === 'flash') {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const grad = ctx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, burst.r);
            grad.addColorStop(0, `rgba(255, 250, 230, ${0.52 * alpha})`);
            grad.addColorStop(1, 'rgba(255, 250, 230, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(burst.x, burst.y, burst.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
          }

          for (const p of burst.particles) {
            if (burst.color === 'blue') {
              ctx.fillStyle = `rgba(110, 190, 255, ${0.62 * alpha})`;
            } else if (burst.color === 'gold') {
              ctx.fillStyle = `rgba(255, 210, 90, ${0.72 * alpha})`;
            } else {
              ctx.fillStyle = `rgba(255, 110, 70, ${0.65 * alpha})`;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function spawnEyegazeBottomBurst(x, y, size) {
        const particles = [];
        const count = 16;
        for (let i = 0; i < count; i += 1) {
          const a = (i / count) * Math.PI * 2;
          const speed = 80 + Math.random() * 120;
          particles.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed * 0.75,
            r: Math.max(2, size * 0.045 + Math.random() * 2)
          });
        }
        fxBursts.push({
          life: 0.7,
          maxLife: 0.7,
          particles,
          type: 'particles',
          color: 'orange'
        });
      }

      function spawnProjectileBurst(x, y, size) {
        const particles = [];
        const count = 28;
        for (let i = 0; i < count; i += 1) {
          const a = (i / count) * Math.PI * 2;
          const speed = 45 + Math.random() * 70;
          particles.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            r: Math.max(2.2, size * 0.045 + Math.random() * 2.6)
          });
        }
        fxBursts.push({ life: 1.35, maxLife: 1.35, particles, drag: 0.994, type: 'particles', color: 'gold' });
        fxBursts.push({ life: 0.84, maxLife: 0.84, type: 'ring', x, y, r: Math.max(10, size * 0.12), maxR: Math.max(62, size * 1.35) });
        fxBursts.push({ life: 0.78, maxLife: 0.78, type: 'ring', x, y, r: Math.max(7, size * 0.08), maxR: Math.max(46, size * 1.05) });
        fxBursts.push({ life: 0.3, maxLife: 0.3, type: 'flash', x, y, r: Math.max(36, size * 0.72) });
        projectileFlashUntil = performance.now() + 70;
      }

      function spawnShieldContactBurst(x, y, size) {
        const particles = [];
        const count = 18;
        for (let i = 0; i < count; i += 1) {
          const a = (i / count) * Math.PI * 2;
          const speed = 70 + Math.random() * 100;
          particles.push({
            x,
            y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed * 0.8,
            r: Math.max(2, size * 0.035 + Math.random() * 2)
          });
        }
        shieldFlashUntil = performance.now() + EYEGAZE_SHIELD_FLASH_MS;
        fxBursts.push({ life: 0.65, maxLife: 0.65, particles, type: 'particles', color: 'blue' });
      }

      function drawImpactFlash() {
        const strength = Math.max(0, Math.min(1, (projectileFlashUntil - performance.now()) / 70));
        if (strength <= 0.01) return;
        ctx.save();
        ctx.fillStyle = `rgba(255, 250, 210, ${0.11 * strength})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      function updateEyegazeDwell() {
        const hovered = findEyegazeTarget();
        const now = performance.now();
        if (!hovered) {
          hoveredEnemyId = null;
          hoverStartAt = 0;
          return;
        }

        if (hoveredEnemyId !== hovered.id) {
          hoveredEnemyId = hovered.id;
          hoverStartAt = now;
          return;
        }

        if (hoverStartAt && now - hoverStartAt >= EYEGAZE_DWELL_MS) {
          launchEyegazeProjectile(hovered);
          hoveredEnemyId = null;
          hoverStartAt = 0;
        }
      }

      function findEyegazeTarget() {
        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (!e.eyegazeTile || e.resolved || e.attackState) continue;
          const half = e.size * 0.5;
          if (gazeX >= e.x - half && gazeX <= e.x + half && gazeY >= e.y - half && gazeY <= e.y + half) {
            return e;
          }
        }
        return null;
      }

      function launchEyegazeProjectile(target) {
        if (!target || target.resolved) return;
        target.resolved = true;
        const muzzleX = canvas.width * 0.5;
        const muzzleY = player.y - 16;
        const speed = 540;
        const dx = target.x - muzzleX;
        const dy = target.y - muzzleY;
        const dist = Math.hypot(dx, dy) || 1;
        bullets.push({
          x: muzzleX,
          y: muzzleY,
          vx: (dx / dist) * speed,
          vy: (dy / dist) * speed,
          speed,
          targetId: target.id,
          homing: true,
          turnRate: 3.2,
          r: 9,
          trail: []
        });
      }

      function updateHud() {
        scoreNode.textContent = `Score: ${score}`;
        livesNode.textContent = `Lives: ${lives}`;
      }

      function getCurrentLanguage() {
        return (typeof getStoredLanguage === 'function' ? getStoredLanguage() : (document.documentElement.lang || 'fr')) || 'fr';
      }

      function updateHudLanguage() {
        const lang = getCurrentLanguage();
        const scoreLabel = lang === 'fr' ? 'Score' : lang === 'ja' ? 'スコア' : 'Score';
        const livesLabel = lang === 'fr' ? 'Vies' : lang === 'ja' ? 'ライフ' : 'Lives';
        scoreNode.textContent = `${scoreLabel}: ${score}`;
        livesNode.textContent = `${livesLabel}: ${lives}`;
      }

      function usesAmmoMeter() {
        return (difficulty === 'hard' || difficulty === 'competitive') && inputMode !== 'eyegaze';
      }

      function updateCursorVisibility() {
        const eyegazeActive = inputMode === 'eyegaze' && (running || gameOverScreen?.style.display === 'flex');
        document.body.style.cursor = eyegazeActive ? 'none' : '';
      }

      function getSfxContext() {
        if (!window.AudioContext && !window.webkitAudioContext) return null;
        if (!sfxCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          sfxCtx = new Ctx();
        }
        if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
        return sfxCtx;
      }

      function playSfx(type) {
        const ctx = getSfxContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, now);

        if (type === 'launch') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(520, now);
          o.frequency.exponentialRampToValueAtTime(820, now + 0.08);
          g.gain.exponentialRampToValueAtTime(0.05, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
          o.start(now);
          o.stop(now + 0.14);
          return;
        }
        if (type === 'hit') {
          o.type = 'square';
          o.frequency.setValueAtTime(360, now);
          o.frequency.exponentialRampToValueAtTime(190, now + 0.07);
          g.gain.exponentialRampToValueAtTime(0.035, now + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
          o.start(now);
          o.stop(now + 0.11);
          return;
        }
        if (type === 'destroy') {
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(240, now);
          o.frequency.exponentialRampToValueAtTime(70, now + 0.26);
          g.gain.exponentialRampToValueAtTime(0.06, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
          o.start(now);
          o.stop(now + 0.32);
          return;
        }
        if (type === 'shield') {
          o.type = 'square';
          o.frequency.setValueAtTime(140, now);
          o.frequency.exponentialRampToValueAtTime(65, now + 0.32);
          g.gain.exponentialRampToValueAtTime(0.075, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          o.start(now);
          o.stop(now + 0.38);
          return;
        }
        if (type === 'retry') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(390, now);
          o.frequency.exponentialRampToValueAtTime(540, now + 0.1);
          g.gain.exponentialRampToValueAtTime(0.04, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          o.start(now);
          o.stop(now + 0.18);
          return;
        }
        // start
        o.type = 'triangle';
        o.frequency.setValueAtTime(260, now);
        o.frequency.exponentialRampToValueAtTime(620, now + 0.18);
        g.gain.exponentialRampToValueAtTime(0.045, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
        o.start(now);
        o.stop(now + 0.26);
      }

      function getShotCost() {
        return difficulty === 'competitive' ? 0.55 : 0.35;
      }

      function getAmmoRegenPerSecond() {
        return difficulty === 'competitive' ? 0.22 : 0.3;
      }

      function updateAmmoMeter() {
        if (!ammoMeter || !ammoMeterFill) return;
        ammoMeter.style.display = usesAmmoMeter() ? 'block' : 'none';
        const percent = Math.round(ammoEnergy * 100);
        const hue = Math.round(ammoEnergy * 120); // 0 red -> 120 green
        ammoMeterFill.style.height = `${percent}%`;
        ammoMeterFill.style.background = `hsl(${hue} 88% 52%)`;
        ammoMeterFill.style.boxShadow = `0 0 16px hsla(${hue} 95% 60% / 0.65)`;
      }

      function tick(ts) {
        if (!running) return;
        const dt = Math.min(0.033, (ts - lastTs) / 1000 || 0.016);
        lastTs = ts;

        updateStars(dt);
        updateGame(dt);

        drawStars();
        drawEyegazeDangerLine();
        drawEnemies();
        drawFxBursts();
        drawBullets();
        drawImpactFlash();
        drawPlayer();

        rafId = requestAnimationFrame(tick);
      }

      function startGame() {
        controlPanel.style.display = 'none';
        gameContainer.style.display = 'block';
        hud.style.display = 'block';
        gameOverScreen.style.display = 'none';
        if (languageToggleButton) languageToggleButton.style.display = 'none';
        if (retryRafId) cancelAnimationFrame(retryRafId);
        retryRafId = null;
        retryHoverStartAt = 0;
        if (retryEyegazeFill) retryEyegazeFill.style.transform = 'scale(0)';
        if (retryEyegazeTile) retryEyegazeTile.style.display = 'none';
        if (retryHint) retryHint.textContent = '';
        if (restartButton) restartButton.style.display = 'none';

        score = 0;
        lives = difficulty === 'competitive' ? 2 : difficulty === 'hard' ? 5 : 4;
        bullets.length = 0;
        enemies.length = 0;
        enemySpawnTimer = 0;
        currentSpawnDelay = getSpawnDelayMs();
        motionTime = 0;
        ammoEnergy = 1;
        hoveredEnemyId = null;
        hoverStartAt = 0;
        player.x = canvas.width * 0.5;
        running = true;
        updateHudLanguage();
        updateAmmoMeter();
        updateCursorVisibility();

        spawnEnemy();
        playSfx('start');
        try { music.currentTime = 0; music.play(); } catch (_) {}
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        }

        lastTs = performance.now();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(tick);
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(rafId);
        music.pause();
        updateCursorVisibility();
        if (gazePointer) gazePointer.style.opacity = '0';
        const lang = getCurrentLanguage();
        const finalScoreLabel = lang === 'fr' ? 'Score final' : lang === 'ja' ? '最終スコア' : 'Final score';
        gameOverScore.textContent = `${finalScoreLabel}: ${score}`;
        if (retryRafId) cancelAnimationFrame(retryRafId);
        retryRafId = null;
        retryHoverStartAt = 0;
        if (retryEyegazeFill) retryEyegazeFill.style.transform = 'scale(0)';
        if (restartButton) restartButton.style.display = 'none';
        if (inputMode === 'eyegaze') {
          if (retryHint) retryHint.textContent = lang === 'fr' ? 'Réessayer ?' : lang === 'ja' ? 'もう一度？' : 'Try again?';
          if (retryEyegazeTile) retryEyegazeTile.style.display = 'block';
          startEyegazeRetryMonitor();
        } else {
          if (retryHint) retryHint.textContent = lang === 'fr' ? 'Appuie sur espace pour recommencer' : lang === 'ja' ? 'スペースキーで再開' : 'Press space to retry';
          if (retryEyegazeTile) retryEyegazeTile.style.display = 'none';
        }
        gameOverScreen.style.display = 'flex';
        updateCursorVisibility();
        updateGazePointer(gazeX, gazeY);
      }

      function startEyegazeRetryMonitor() {
        if (inputMode !== 'eyegaze') return;
        const loop = () => {
          if (running || !gameOverScreen || gameOverScreen.style.display !== 'flex') return;
          const rect = retryEyegazeTile?.getBoundingClientRect();
          if (!rect) return;
          const inside = gazeX >= rect.left && gazeX <= rect.right && gazeY >= rect.top && gazeY <= rect.bottom;
          const now = performance.now();
          if (inside) {
            if (!retryHoverStartAt) retryHoverStartAt = now;
            const progress = Math.max(0, Math.min(1, (now - retryHoverStartAt) / EYEGAZE_DWELL_MS));
            if (retryEyegazeFill) retryEyegazeFill.style.transform = `scale(${progress})`;
            if (progress >= 1) {
              playSfx('retry');
              startGame();
              return;
            }
          } else {
            retryHoverStartAt = 0;
            if (retryEyegazeFill) retryEyegazeFill.style.transform = 'scale(0)';
          }
          retryRafId = requestAnimationFrame(loop);
        };
        retryRafId = requestAnimationFrame(loop);
      }

      function applyInputMode(mode) {
        inputMode = mode === 'eyegaze' ? 'eyegaze' : 'switch';
        document.body.setAttribute('data-input-mode', inputMode);

        const buttons = Array.from(document.querySelectorAll('.input-mode-btn'));
        buttons.forEach((button) => {
          const selected = button.dataset.inputMode === inputMode;
          button.classList.toggle('selected', selected);
          button.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
        updateAmmoMeter();
        updateCursorVisibility();
      }

      function applyDifficulty(mode) {
        difficulty = ['normal', 'hard', 'competitive'].includes(mode) ? mode : 'normal';
        const modeButtons = Array.from(document.querySelectorAll('#stop-action-mode-segmented-control .stop-action-mode-btn'));
        modeButtons.forEach((button) => {
          const selected = button.dataset.mode === difficulty;
          button.classList.toggle('selected', selected);
          button.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });

        const desc = document.getElementById('stop-action-mode-description');
        if (!desc) return;
        if (difficulty === 'hard') {
          desc.dataset.fr = 'Ennemis 25% plus rapides, apparition toutes les 5 à 8 secondes, ennemis blindés (2 coups), 5 vies, barre de recharge munitions.';
          desc.dataset.en = 'Enemies are 25% faster, spawn every 5 to 8 seconds, tank enemies need 2 hits, 5 lives, with an ammo recharge bar.';
          desc.dataset.ja = '敵は25%高速化、5〜8秒ごとに出現、2発必要なタンク敵、ライフ5、弾薬リチャージバーあり。';
        } else if (difficulty === 'competitive') {
          desc.dataset.fr = 'Mode Maître : ennemis 50% plus rapides, apparition toutes les 3 à 4 secondes, ennemis blindés, 2 vies, tirs consomment davantage la barre.';
          desc.dataset.en = 'Master mode: enemies are 50% faster, spawn every 3 to 4 seconds, includes tank enemies, 2 lives, and shots consume more ammo charge.';
          desc.dataset.ja = 'マスター：敵は50%高速、3〜4秒ごとに出現、タンク敵あり、ライフ2、射撃時の消費チャージが大きい。';
        } else {
          desc.dataset.fr = 'Cadence équilibrée pour commencer.';
          desc.dataset.en = 'Balanced pace to get started.';
          desc.dataset.ja = '始めやすいバランス設定です。';
        }

        const lang = getCurrentLanguage();
        desc.textContent = lang === 'en' ? desc.dataset.en : lang === 'ja' ? desc.dataset.ja : desc.dataset.fr;
        updateAmmoMeter();
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.code === 'Space') {
          event.preventDefault();
          if (running) shoot();
          else if (inputMode !== 'eyegaze' && gameOverScreen?.style.display === 'flex') {
            playSfx('retry');
            startGame();
          }
        }
      });

      const gazePointer = document.getElementById('gazePointer');
      function updateGazePointer(x, y) {
        gazeX = x;
        gazeY = y;
        const eyegazeActive = inputMode === 'eyegaze' && (running || gameOverScreen?.style.display === 'flex');
        if (!eyegazeActive) {
          if (gazePointer) gazePointer.style.opacity = '0';
          return;
        }
        if (gazePointer) {
          gazePointer.style.display = 'block';
          gazePointer.style.opacity = '1';
          gazePointer.style.left = `${x}px`;
          gazePointer.style.top = `${y}px`;
        }
      }
      document.addEventListener('pointermove', (event) => {
        updateGazePointer(event.clientX, event.clientY);
      });

      startButton.addEventListener('click', () => {
        startGame();
      });
      restartButton.addEventListener('click', () => {
        playSfx('retry');
        startGame();
      });

      document.getElementById('language-toggle')?.addEventListener('pointerup', () => {
        toggleLanguage();
        updateHudLanguage();
        applyDifficulty(difficulty);
      });

      Array.from(document.querySelectorAll('.input-mode-btn')).forEach((button) => {
        button.addEventListener('click', () => applyInputMode(button.dataset.inputMode));
      });

      Array.from(document.querySelectorAll('#stop-action-mode-segmented-control .stop-action-mode-btn')).forEach((button) => {
        button.addEventListener('click', () => applyDifficulty(button.dataset.mode));
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        if (!running) {
          drawStars();
          drawPlayer();
        }
      });

      resizeCanvas();
      loadSprites();
      makeStars();
      applyInputMode('switch');
      applyDifficulty('normal');
      updateHudLanguage();
      updateAmmoMeter();
      drawStars();
      drawPlayer();
    })();
  </script>
</body>
</html>
