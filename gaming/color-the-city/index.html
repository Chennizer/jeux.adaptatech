<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Coloré · Adaptatech</title>
  <link rel="stylesheet" href="../../css/video-stop-action.css">
  <link rel="stylesheet" href="style.css">
  <script src="scenes.js" defer></script>
  <script src="menu-previews.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="templates.js" defer></script>
  <script src="backgrounds.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <section id="menu" class="menu-screen" aria-labelledby="game-title">
    <div id="control-panel-options" class="control-panel-options"><div class="game-menu-layout stop-action-menu-layout">
    <div class="menu-card game-menu-main">
      <header id="options-title-bar"><h1 id="options-arcade-title">Arcade</h1><h2 id="game-title" data-i18n="title">Coloré</h2></header>
      <fieldset class="mode-choices"><legend class="sr-only" data-i18n="chooseMode">Choisis ton mode</legend><div id="stop-action-mode-segmented-control" class="mode-grid">
        <label class="mode-choice stop-action-mode-btn"><input type="radio" name="colourMode" value="auto" checked aria-describedby="autoModeHelp"><span data-i18n="autoModeShort">Auto</span></label>
        <label class="mode-choice stop-action-mode-btn"><input type="radio" name="colourMode" value="manual" aria-describedby="manualModeHelp"><span data-i18n="manualModeShort">Manuel</span></label>
      </div><p id="autoModeHelp" class="sr-only" data-i18n="autoModeHelp">Les couleurs changent toutes les 12 secondes. Espace ou Entrée pour peindre.</p><p id="manualModeHelp" class="sr-only" data-i18n="manualModeHelp">Espace pour peindre. Entrée pour changer de couleur.</p></fieldset>
      <section class="difficulty-panel" aria-labelledby="difficulty-label">
        <div class="difficulty-heading"><label id="difficulty-label" for="difficulty" data-i18n="difficulty">Difficulté</label><output id="difficultyValue" for="difficulty">5 / 5</output></div>
        <input id="difficulty" type="range" min="1" max="5" step="1" value="5" aria-describedby="difficultyDescription">
        <div class="difficulty-ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        <output id="difficultyDescription" class="sr-only" for="difficulty"></output>
      </section>
      <button id="mainAction" class="paint-button button" type="button" autofocus><svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 2C9 8 3 14 3 19a9 9 0 0 0 18 0C21 14 15 8 12 2Z" fill="currentColor"/></svg><span id="actionLabel">Commencer</span></button>
      <footer class="menu-actions">
        <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg><span class="sr-only" data-i18n="games">Jeux pour switch</span></a>
        <button id="settingsButton" class="settings-button" type="button" aria-haspopup="dialog" aria-controls="options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 3-2.6 1.5L3 7l-1 3 2.1 2-2.1 2 1 3 2.7-.5L8.3 18 9 21h6l.7-3 2.6-1.5 2.7.5 1-3-2.1-2 2.1-2-1-3-2.7.5L15.7 6 15 3Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="settings">Réglages</span></button>
      </footer>
      <div class="sr-only"><span id="menuColourSwatch"></span><span id="menuColourName"></span></div>
      <p class="menu-hint sr-only" data-i18n="menuHint">Espace ou Entrée · switch · clic · toucher. Échap pour revenir au menu.</p>
    </div>
    <aside class="menu-art game-menu-art">
      <fieldset class="scene-choices ship-select-panel">
        <legend class="scene-panel-title" data-i18n="scenes">Scènes</legend>
        <div class="scene-grid">
          <label class="scene-choice"><input type="radio" name="drawingScene" value="city" checked><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M13 60V27h22v33m0 0V12h29v48m0 0V33h23v27M8 60h84M43 23h5m6 0h4M43 34h5m6 0h4M43 45h5m6 0h4M20 36h7m-7 12h7m45-6h7m-7 10h7"/></svg><span data-i18n="sceneCity">Ville</span></label>
          <label class="scene-choice"><input type="radio" name="drawingScene" value="forest"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M23 60V44m-4 0H6l9-14H9L23 8l14 22h-6l9 14H27m35 16V39m0 0C39 42 35 22 46 18C43 2 71 1 75 15C92 10 99 34 80 39Zm-8 8 8 7 9-9M4 60h92"/></svg><span data-i18n="sceneForest">Forêt</span></label>
          <label class="scene-choice"><input type="radio" name="drawingScene" value="village"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M12 59V37h29v22M7 37l20-18 19 18ZM60 60V30h20v30M56 30l14-15 14 15ZM20 59V47h12v12M70 16V5m-9 8h18M40 59h18M5 60h90"/></svg><span data-i18n="sceneVillage">Village</span></label>
          <label class="scene-choice"><input type="radio" name="drawingScene" value="farm"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M10 60V30l20-17 20 17v30M7 30h46M21 60V38h18v22M21 38l18 22m0-22L21 60M65 60V20q10-15 20 0v40M65 26h20M5 61h88M30 18V8m-7 0h14"/></svg><span data-i18n="sceneFarm">Ferme</span></label>
          <label class="scene-choice"><input type="radio" name="drawingScene" value="planets"><svg viewBox="0 0 100 70" aria-hidden="true"><circle cx="50" cy="35" r="22"/><path d="M28 33C-6 50 12 62 56 44S99 10 71 25M32 22q18-7 34 1M32 47q18 8 33-1M80 7v10m-5-5h10M13 15v8m-4-4h8" fill="none"/></svg><span data-i18n="scenePlanets">Planètes</span></label>
        </div>
      </fieldset>
    </aside>
    </div></div>
  </section>
  <dialog id="options" class="settings-modal" aria-labelledby="settingsTitle">
    <header class="modal-heading"><h2 id="settingsTitle" data-i18n="settings">Réglages</h2><button id="closeSettings" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span class="sr-only" data-i18n="close">Fermer</span></button></header>
    <div class="settings-tabs" role="tablist" aria-labelledby="settingsTitle">
      <button id="gameTab" type="button" role="tab" aria-selected="true" aria-controls="gameSettings" tabindex="0" data-i18n="gameSettings">Jeu</button>
      <button id="audioTab" type="button" role="tab" aria-selected="false" aria-controls="audioSettings" tabindex="-1" data-i18n="audioSettings">Audio</button>
    </div>
    <div id="gameSettings" class="settings-panel" role="tabpanel" aria-labelledby="gameTab" tabindex="0">
      <div class="options-grid">
          <label class="setting"><span data-i18n="language">Langue</span><select id="language"><option value="fr">Français</option><option value="en">English</option><option value="ja">日本語</option></select></label>
          <label class="setting"><span data-i18n="speed">Vitesse du zeppelin</span><select id="speed"><option value="45" data-i18n="slow">Douce</option><option value="75" selected data-i18n="normal">Tranquille</option><option value="120" data-i18n="fast">Rapide</option></select></label>
          <label class="setting"><span data-i18n="guide">Guide de visée</span><input id="guide" type="checkbox"></label>
          <label class="setting"><span data-i18n="assist">Coup de pouce</span><input id="assist" type="checkbox" checked></label>
      </div>
    </div>
    <div id="audioSettings" class="settings-panel" role="tabpanel" aria-labelledby="audioTab" tabindex="0" hidden>
      <div class="options-grid">
          <label class="setting"><span data-i18n="musicLabel">Musique</span><input id="musicEnabled" type="checkbox" checked></label>
          <label class="setting volume-setting"><span data-i18n="musicVolume">Volume de la musique</span><input id="musicVolume" type="range" min="0" max="100" value="17"></label>
          <label class="setting"><span data-i18n="soundLabel">Sons de peinture</span><input id="sound" type="checkbox" checked></label>
          <label class="setting volume-setting"><span data-i18n="effectsVolume">Volume des sons</span><input id="effectsVolume" type="range" min="0" max="100" value="40"></label>
        </div>
    </div>
  </dialog>
  <main id="game" hidden>
    <svg id="completionSky" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="completionArt"></g></svg>
    <div class="drawing-board" id="playSurface" data-state="ready" tabindex="0" role="button" aria-label="Lâcher une goutte de peinture">
      <svg id="scene" viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-description">
        <title id="scene-title">Colore la ville</title>
        <desc id="scene-description">Un grand zeppelin survole quatre maisons blanches. Appuie pour peindre un étage.</desc>
        <defs><clipPath id="drawingBounds"><rect width="1200" height="720"/></clipPath></defs>
        <defs id="paintDefs"></defs>
        <rect id="drawingPaper" width="1200" height="720" fill="#fff"/>
        <g clip-path="url(#drawingBounds)">
        <g id="streetDetails" aria-hidden="true"></g>
        <g id="buildings"></g>
        <line id="aimGuide" x1="170" x2="170" y1="282" y2="650" stroke="#a9a6b4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12"/>
        <ellipse id="aimMark" cx="170" cy="650" rx="14" ry="4" fill="#c5bdd9"/>
        <g id="airship" transform="translate(239 96)" aria-hidden="true" stroke="#45404f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- A big, friendly paint-carrying zeppelin. Its drop outlet is at x=0. -->
          <path d="M-148-19-221-57-208-4-159 9" fill="#b8a5e8"/>
          <path d="M-158 18-215 59-203 13-163-4" fill="#97d9c7"/>
          <path d="M-183-2C-172-80-22-100 96-66C141-53 176-27 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="#fff0ac"/>
          <path d="M-183-2C-164-58-30-71 91-45C135-36 166-21 185-3C155-14 132-21 91-25C-27-40-140-35-183-2Z" fill="#ffbbad" stroke="none"/>
          <path d="M-183-2C-140 18-22 31 91 18C134 13 164 5 185-3C166 24 126 51 48 60C-64 72-165 40-183-2Z" fill="#bca9ec" stroke="none"/>
          <path d="M-183-2C-148 46-27 62 91 40C134 32 164 15 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="#9edcc8" stroke="none"/>
          <path d="M-183-2C-172-80-22-100 96-66C141-53 176-27 185-3C174 31 126 63 48 72C-66 87-172 56-183-2Z" fill="none"/>
          <path d="M-175-3C-108-25 86-24 175-3M-167 18C-82 49 76 46 165 14M-164-24C-77-66 73-55 160-23" fill="none" stroke-width="1.8" opacity=".7"/>
          <path d="M-79 63-61 99M51 69 35 99" fill="none"/>
          <path id="paintGondola" d="M-74 98H52L39 131H-49Q-66 129-74 98Z" fill="#ffb39e"/>
          <path d="M-74 98H52" stroke-width="5"/>
          <g fill="#fff"><circle cx="-43" cy="112" r="7"/><circle cx="-14" cy="112" r="7"/><circle cx="15" cy="112" r="7"/></g>
          <path d="M-74 112h-31V92h-21M-123 77-126 108M-137 92h27" fill="none" stroke-width="2.5"/><ellipse cx="-126" cy="92" rx="8" ry="16" fill="#fff"/>
          <g id="paintColourBadge" transform="translate(69 -3)" role="img" aria-labelledby="paint-colour-title"><title id="paint-colour-title">Couleur active</title><path d="M0-38C-9-22-30-4-30 13a30 30 0 0 0 60 0C30-4 9-22 0-38Z" fill="#fff" stroke="#fff" stroke-width="10"/><path id="activePaint" d="M0-38C-9-22-30-4-30 13a30 30 0 0 0 60 0C30-4 9-22 0-38Z" fill="#ffb39e" stroke-width="2.5"/><path d="M-17 10q-3 15 10 19" fill="none" stroke="#fff" stroke-width="5"/></g>
          <path d="M-34 132h68v20q-34 14-68 0Z" id="paintBucket" fill="#ffb39e"/>
          <path d="M-24 144h10" stroke="#fff" stroke-width="4"/>
          <path d="M-147-34q9-8 18-4" fill="none" stroke="#fff" stroke-width="6"/>
        </g>
        <g id="drops"></g>
        <g id="effects" aria-hidden="true"></g>
        </g>
      </svg>
    </div>
  </main>
  <progress id="progress" class="sr-only" value="0" max="12" aria-label="Étages peints"></progress>
  <p id="feedback" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p>Active JavaScript pour jouer. / Enable JavaScript to play.</p></noscript>
</body>
</html>
