<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Space Adventure Co-op</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./client.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="toolbar">
      <label class="language">
        <span class="sr-only" data-copy="language">Langue</span>
        <select id="language">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <button id="sound" type="button" class="compact" aria-pressed="false" data-copy="soundOff">Son désactivé</button>
    </div>
  </header>

  <main>
    <section id="lobby" class="lobby" aria-labelledby="title">
      <div class="menu">
        <div class="intro">
          <h1 id="title">Space Adventure <span data-copy="multiplayer">Multijoueur</span></h1>
          <p data-copy="intro">Jouez en équipe sur deux écrans. Chaque joueur choisit le contacteur ou le regard.</p>
        </div>

        <div class="panel">
          <fieldset id="controls">
            <legend data-copy="controls">Vos commandes</legend>
            <div class="options">
              <button id="switch-option" class="choice blue" type="button" aria-pressed="true" data-input="switch" data-dwell>
                <span data-copy="switch">Contacteur</span>
                <span data-copy="switchHint">ESPACE ou ENTRÉE pour tirer</span>
              </button>
              <button id="gaze-option" class="choice red" type="button" aria-pressed="false" data-input="gaze" data-dwell>
                <span data-copy="gaze">Regard</span>
                <span data-copy="gazeHint">Fixez un ennemi pendant une seconde</span>
              </button>
            </div>
          </fieldset>

          <div id="entry" class="room-entry">
            <button id="create" type="button" class="primary" data-copy="create" data-dwell>Créer une salle</button>
            <form id="join">
              <label for="code" data-copy="code">Code de la salle</label>
              <div class="join-row">
                <input id="code" size="8" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" required placeholder="ABCDE234">
                <button type="submit" data-copy="join" data-dwell>Rejoindre</button>
              </div>
            </form>
          </div>

          <div id="room" hidden>
            <div class="invite">
              <div>
                <span class="field-label" data-copy="code">Code de la salle</span>
                <strong id="room-code" class="room-code"></strong>
              </div>
              <div class="share-actions">
                <button id="copy-code" type="button" data-copy="copyCode" data-dwell>Copier le code</button>
                <button id="copy" type="button" data-copy="copy" data-dwell>Copier le lien</button>
              </div>
              <input id="invite-value" type="text" data-copy-label="link" aria-label="Lien d’invitation" readonly hidden>
            </div>
            <div class="players">
              <div class="player blue" id="player-1">
                <img src="/images/spaceadventure/blueship.png" alt="">
                <div><strong data-copy="p1">Joueur 1</strong><span class="player-status"></span></div>
              </div>
              <div class="player red" id="player-2">
                <img src="/images/spaceadventure/redship.png" alt="">
                <div><strong data-copy="p2">Joueur 2</strong><span class="player-status"></span></div>
              </div>
            </div>
            <div class="actions">
              <button id="ready" class="primary" type="button" data-copy="ready" data-dwell>Prêt</button>
              <button id="leave" type="button" data-copy="leave" data-dwell>Quitter</button>
            </div>
            <p id="result" class="result" hidden></p>
          </div>
          <p id="status" class="status" role="status"></p>
        </div>
        <a href="https://adaptatech.org/arcade/space-invaders-fruits/" data-copy="solo">Space Adventure original</a>
      </div>

      <aside class="art" aria-hidden="true">
        <div class="ship-card blue">
          <img src="/images/spaceadventure/blueship.png" alt="">
          <span data-copy="p1">Joueur 1</span>
        </div>
        <div class="ship-card red">
          <img src="/images/spaceadventure/redship.png" alt="">
          <span data-copy="p2">Joueur 2</span>
        </div>
      </aside>
    </section>

    <section id="mission" class="mission" aria-label="Space Adventure" hidden>
      <div class="hud">
        <div><span data-copy="teamScore">Score de l’équipe</span><strong id="score">0</strong></div>
        <div><span data-copy="time">Temps</span><strong id="timer">5:00</strong></div>
        <div><span data-copy="yourShip">Votre vaisseau</span><strong id="ship"></strong></div>
      </div>
      <div class="playfield">
        <canvas id="field" tabindex="-1" width="960" height="640" aria-label="Space Adventure playfield"></canvas>
        <div id="pause" class="pause" role="status" hidden></div>
      </div>
      <div class="mission-controls">
        <span id="mission-hint"></span>
        <button id="fire" type="button" data-copy="fire">Tirer</button>
        <button id="exit" type="button" data-copy="leave" data-dwell>Quitter</button>
      </div>
    </section>
  </main>
</body>
</html>
