<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../images/binou.png">
  <title>Reinforcer</title>
  <script src="../js/themes.js"></script>
  <script src="js/games-config.js"></script>
  <script src="js/session-helpers.js"></script>
  <script src="js/reinforcer-overlay.js"></script>
  <script src="js/fullscreen.js"></script>
  <link rel="stylesheet" href="../css/ipadteachh.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #f0f9ff;
      height: 100%;
      margin: 0;
    }
    /* Container overlay */
    #reinforcerOverlay {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0f172a;
    }
    /* Play button styling */
    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    #playButton svg {
      width: 120px;
      height: 120px;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
      transition: transform 0.2s ease-in-out;
      animation: pulse 2s infinite;
    }
    #playButton:hover svg {
      transform: scale(1.1);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    /* Overlay to block interactions with the video */
    #videoOverlayCover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: none;
      z-index: 5;
    }
    /* Social reinforcer styling */
    #socialReinforcer {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      color: #0f172a;
      background: linear-gradient(135deg, #f8fdff 0%, #e0f2ff 55%, #ccfbf1 100%);
    }
    #socialReinforcer .social-content {
      max-width: 680px;
      width: min(90vw, 680px);
      display: flex;
      flex-direction: column;
      gap: 32px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      padding: clamp(32px, 5vw, 48px);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
      border: 2px solid rgba(20, 184, 166, 0.2);
    }
    #socialReinforcer .social-message {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #0f766e;
      text-shadow: 0 4px 16px rgba(45, 212, 191, 0.25);
    }
    #socialReinforcer .progress-visual {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #socialReinforcer .progress-track {
      width: 100%;
      height: 18px;
      border-radius: 12px;
      background: rgba(14, 165, 233, 0.18);
      overflow: hidden;
      border: 2px solid rgba(14, 165, 233, 0.3);
      box-shadow: inset 0 0 12px rgba(14, 165, 233, 0.15);
    }
    #socialReinforcer .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #14b8a6);
      transition: width 0.2s linear;
    }
    #socialReinforcer .progress-hint {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 600;
      color: #0369a1;
    }
    #socialReinforcer .progress-remaining {
      font-weight: 700;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <!-- Overlay container for video or image reinforcer -->
  <div id="reinforcerOverlay">
    <!-- Video element for short video reinforcer -->
    <video id="reinforcerVideo"
           playsinline
           webkit-playsinline
           disablepictureinpicture
           controlslist="nodownload noremoteplayback"
           preload="auto"
           style="background-color: black;">
      <source id="reinforcerVideoSource" src="" type="video/mp4">
      Votre navigateur ne supporte pas la balise vidéo.
    </video>
    <!-- Play button with a fun, animated SVG icon -->
    <button id="playButton">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#7aff59; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#12941d; stop-opacity:1" />
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#grad)" stroke="#fff" stroke-width="5" />
        <polygon points="40,30 70,50 40,70" fill="#fff"/>
      </svg>
    </button>

    <!-- Image element for image reinforcer (initially hidden) -->
    <img id="reinforcerImage" src="" alt="Reinforcer Image" style="display:none; background-color:black; max-width:90%; border:3px solid #fff; border-radius:10px;">
    <div id="videoOverlayCover"></div>
    <div id="socialReinforcer" aria-live="polite">
      <div class="social-content">
        <p class="social-message">Bravo :) tu as fini un panier&nbsp;!</p>
        <div class="progress-visual">
          <div class="progress-track" role="presentation">
            <div class="progress-fill"></div>
          </div>
          <p class="progress-hint">Prochain jeu dans <span class="progress-remaining">30</span>&nbsp;secondes</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.reinforcerOverlay && typeof window.reinforcerOverlay.bootstrapReinforcerPage === 'function') {
        window.reinforcerOverlay.bootstrapReinforcerPage();
      } else if (window.sessionHelpers && typeof window.sessionHelpers.runSessionFlow === 'function') {
        const flow = window.sessionHelpers.runSessionFlow();
        if (flow && typeof window.sessionHelpers.startNextStep === 'function') {
          window.sessionHelpers.startNextStep(flow.reinforcerController, {
            reinforcerType: flow.session && flow.session.selections
              ? flow.session.selections.reinforcerType
              : 'shortvideo'
          });
        }
      }
    });
  </script>
</body>
</html>
