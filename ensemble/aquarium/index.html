<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquarium Ensemble — Adaptatech</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
</head>
<body>
  <main id="app">
    <section id="welcome" class="panel" aria-labelledby="title">
      <p class="eyebrow">Adaptatech présente</p>
      <h1 id="title">Aquarium Ensemble</h1>
      <p class="lead">Créez un aquarium à plusieurs, même avec des moyens d’accès différents.</p>
      <div class="room-row">
        <label for="room">Code de l’activité</label>
        <input id="room" maxlength="6" autocomplete="off" value="OCEAN" aria-describedby="roomHelp">
        <button id="randomRoom" class="secondary" type="button">Nouveau code</button>
      </div>
      <p id="roomHelp" class="hint">Entrez le même code sur chaque appareil.</p>
      <div class="role-grid" aria-label="Choisir un rôle">
        <button class="role" data-role="display"><span>🖥️</span><strong>Grand écran</strong><small>Affiche la création commune</small></button>
        <button class="role" data-role="gaze"><span>👀</span><strong>Regard</strong><small>Guide le poisson vedette</small></button>
        <button class="role" data-role="switch"><span>🔘</span><strong>Switch</strong><small>Ajoute bulles et nourriture</small></button>
        <button class="role" data-role="touch"><span>☝️</span><strong>Tactile</strong><small>Décore l’aquarium</small></button>
      </div>
    </section>

    <section id="activity" hidden>
      <canvas id="aquarium" aria-label="Aquarium collaboratif interactif"></canvas>
      <header class="hud">
        <button id="back" class="round" aria-label="Retour au choix du rôle">←</button>
        <div><strong>Aquarium Ensemble</strong><span id="roomBadge"></span></div>
        <p id="status" role="status">Connexion…</p>
      </header>
      <div id="instructions" class="instructions"></div>
      <div id="touchTools" class="tools" hidden>
        <button data-item="plant" class="selected">🌿<span>Plante</span></button>
        <button data-item="coral">🪸<span>Corail</span></button>
        <button data-item="shell">🐚<span>Coquillage</span></button>
        <button data-item="fish">🐠<span>Poisson</span></button>
      </div>
      <div id="switchButton" class="switch-button" hidden>APPUYEZ<br><small>Espace ou Entrée</small></div>
      <div id="gazePointer" aria-hidden="true"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
