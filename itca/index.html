<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courbe des comportements agressifs — v23</title>
<style>
:root{
  --green-bg:#4f7f11;
  --ui-bg:rgba(42,78,8,.44);
  --ui-brd:rgba(255,255,255,.22);
  --ui-on:rgba(255,255,255,.18);
  --ui-off:rgba(0,0,0,.18);
  --recovery:#7ba1c9;
  --control:#d9ddb5;
  --control-text:#384114;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--green-bg);font-family:Arial,Helvetica,sans-serif
}
.screen{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
  background:var(--green-bg)
}
svg{
  display:block;width:100vw;height:100vh;height:100dvh;
  background:var(--green-bg)
}
.title{
  font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:700;
  fill:#d9dfca;stroke:#1f2b0b;stroke-width:1.2;paint-order:stroke fill
}
.outer-circle{fill:#d1d1d1;stroke:#ededed;stroke-width:4}
.axis{stroke:#efefef;stroke-width:4}
.phase-line{stroke:#eef6d8;stroke-width:2.3}

.outer-pill ellipse{
  stroke:rgba(255,255,255,.28);
  stroke-width:2;
}
.outer-pill text{
  font-size:14px;
  font-weight:800;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}
.outer-pill.control text{fill:var(--control-text)}
.outer-pill.recovery text{fill:#fff}

.bubble,.cause-item,.center-step,.outer-pill{
  cursor:pointer;
  transition:opacity .2s ease;
}
.bubble:hover ellipse,.center-step:hover ellipse,.outer-pill:hover ellipse{
  filter:brightness(1.07);
  stroke-width:3.5;
}
.bubble ellipse,.center-step ellipse{
  stroke:#3b3b3b;
  stroke-width:2.1;
  transition:stroke-width .2s ease, filter .25s ease;
}
.bubble text,.center-step text{
  font-weight:900;font-size:15px;fill:#fff;text-anchor:middle;
  dominant-baseline:middle;pointer-events:none
}
.bubble.yellow text{fill:#1d1d1d}
.hidden{opacity:0;pointer-events:none}

.cause-ring{fill:#f7f7f7;stroke:#7f7f7f;stroke-width:2.5}
.cause-sep{stroke:#b7b7b7;stroke-width:2;stroke-linecap:round}
.cause-text{
  fill:#5e84bb;font-weight:800;font-size:15px;
  text-anchor:middle;dominant-baseline:middle;letter-spacing:-.1px
}
.cause-text.small{font-size:14px}
.cause-hit{
  fill:rgba(0,0,0,.001);
  pointer-events:all;
}
.cause-item:hover .cause-hit{fill:rgba(89,126,167,.10)}

.center-step text{fill:#dbe6ff;font-size:19px}

.steps-dock{
  position:fixed;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
}
.steps-toggle{
  min-width:122px;
  min-height:42px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.28);
  background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.09));
  color:#fff;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  backdrop-filter:blur(8px);
  transition:transform .18s ease,background .18s ease,opacity .18s ease;
  text-align:center;
  font-size:11.5px;
  font-weight:800;
  line-height:1.15;
}
.steps-toggle:hover{
  transform:scale(1.02);
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.13));
}
.step-panel{
  width:176px;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:14px;
  border:1px solid rgba(255,255,255,.20);
  background:linear-gradient(155deg,rgba(36,74,6,.80),rgba(47,91,10,.62));
  backdrop-filter:blur(10px);
  border-radius:18px;
  color:#fff;
  box-shadow:0 14px 34px rgba(0,0,0,.20);
  transform-origin:top left;
  transition:opacity .18s ease,transform .22s ease,max-height .22s ease,padding .22s ease;
  overflow:hidden;
  max-height:420px;
}
.steps-dock:not(.open) .step-panel{
  opacity:0;
  transform:translateY(-8px) scale(.97);
  pointer-events:none;
  max-height:0;
  padding-top:0;
  padding-bottom:0;
  border-width:0;
}
.steps-dock.open .step-panel{
  opacity:1;
  transform:translateY(0) scale(1);
  max-height:420px;
}
.step-panel h3{
  margin:0;
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.96;
}
.step-sub{
  font-size:10.5px;
  opacity:.72;
  margin:-2px 0 3px;
}
.step-btn{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.11);
  color:#fff;
  border-radius:12px;
  padding:8px 9px;
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  text-align:left;
  transition:background .15s ease,opacity .15s ease,transform .12s ease,border-color .15s ease;
}
.step-btn:hover{
  transform:translateX(2px);
  background:rgba(255,255,255,.18);
  border-color:rgba(255,255,255,.24);
}
.step-btn.off{
  background:rgba(0,0,0,.14);
  opacity:.52;
}
.step-num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:23px;
  height:23px;
  border-radius:8px;
  background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.18);
  font-size:11px;
  font-weight:800;
  flex:0 0 23px;
}
.step-label{
  line-height:1.08;
}

.fullscreen-wrap{position:fixed;right:15px;bottom:15px;z-index:20}
.fs-btn{
  width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);backdrop-filter:blur(5px);color:#fff;
  border-radius:50%;font-size:14px;cursor:pointer;opacity:.76
}
.fs-btn:hover{background:rgba(255,255,255,.22);opacity:1}

dialog{
  width:min(760px,92vw);
  border:2px solid var(--note-accent,#8a8a8a);
  border-radius:8px;
  padding:0;
  position:relative;
  background:var(--note-bg,#fffdf4);
  box-shadow:0 18px 44px rgba(0,0,0,.24);
  overflow:hidden;
}
dialog::backdrop{background:rgba(0,0,0,.42)}
dialog::after{
  content:'';
  position:absolute;
  top:0;
  right:0;
  width:34px;
  height:34px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.58) 0 49%, rgba(0,0,0,.10) 50% 100%);
  clip-path:polygon(0 0,100% 0,100% 100%);
}
.dialog-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  padding:18px 22px 12px;
  border-bottom:1px solid var(--note-border,#d8d3c5);
  background:rgba(255,255,255,.28);
}
.dialog-head h2{
  margin:0;
  font-size:26px;
  color:#2c3527;
}
.close{
  border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.68);
  width:32px;
  height:32px;
  border-radius:6px;
  cursor:pointer;
  font-size:18px;
  color:#2f372a;
}
.dialog-body{
  padding:18px 22px 22px;
  line-height:1.45;
  max-height:min(70vh,680px);
  overflow:auto;
  background:var(--note-bg,#fffdf4);
}
.detail-kicker{
  display:inline-block;
  margin:0 0 10px;
  padding:0 0 0 10px;
  border-left:4px solid var(--note-accent,#8a8a8a);
  font-size:11px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:#475043;
}
.detail-intro{
  margin:0 0 16px;
  font-size:15px;
  color:#354033;
}
.detail-grid{
  display:block;
}
.detail-card{
  background:rgba(255,255,255,.58);
  border:1px solid rgba(0,0,0,.09);
  border-left:6px solid var(--note-accent,#8a8a8a);
  border-radius:4px;
  padding:12px 13px;
  margin:0 0 11px;
  box-shadow:none;
}
.detail-card.full{grid-column:auto}
.detail-card h3{
  margin:0 0 8px;
  font-size:12px;
  color:#3e4639;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.detail-card ul{
  margin:0;
  padding-left:18px;
}
.detail-card li{margin:4px 0}
.detail-card p{margin:0}
.detail-card.avoid{
  background:rgba(255,255,255,.58);
}
.detail-card.avoid h3,
.detail-card.questions h3{
  color:#3e4639;
}
.detail-card.questions{
  background:rgba(255,255,255,.58);
}
.detail-source{
  display:none;
}

@media(max-width:980px){
  .steps-dock{left:8px}
  .step-panel{width:162px}
  .steps-dock.open .step-panel{max-height:420px}
}
</style>
</head>
<body>

<div class="screen">
<svg viewBox="0 0 1200 850" preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svgTitle svgDesc">

<title id="svgTitle">La courbe des comportements agressifs</title>
<desc id="svgDesc">Courbe interactive des comportements agressifs avec définitions, manifestations et interventions.</desc>

<text x="600" y="44" text-anchor="middle" class="title">
  La courbe des comportements agressifs
</text>

<!-- grand cercle -->
<circle cx="600" cy="452" r="388" class="outer-circle"/>
<line x1="600" y1="64" x2="600" y2="840" class="axis"/>
<line x1="212" y1="452" x2="988" y2="452" class="axis"/>

<!-- Étape 5 : récupération - repères extérieurs en bulles -->
<g data-step="5">
  <line x1="185" y1="185" x2="320" y2="252" class="phase-line"/>
  <line x1="1014" y1="200" x2="884" y2="263" class="phase-line"/>
  <line x1="188" y1="704" x2="344" y2="653" class="phase-line"/>

  <g class="outer-pill recovery" data-key="outer-recovery">
    <ellipse cx="122" cy="185" rx="94" ry="23" fill="var(--recovery)"/>
    <text x="122" y="185">en RÉCUPÉRATION</text>
  </g>
  <g class="outer-pill recovery" data-key="outer-recovery">
    <ellipse cx="1110" cy="200" rx="94" ry="23" fill="var(--recovery)"/>
    <text x="1110" y="200">en RÉCUPÉRATION</text>
  </g>
  <g class="outer-pill recovery" data-key="outer-recovery">
    <ellipse cx="118" cy="704" rx="94" ry="23" fill="var(--recovery)"/>
    <text x="118" y="704">en RÉCUPÉRATION</text>
  </g>
</g>

<!-- Étape 6 : contrôle - repères extérieurs en bulles -->
<g data-step="6">
  <line x1="185" y1="136" x2="315" y2="213" class="phase-line"/>
  <line x1="1012" y1="150" x2="885" y2="226" class="phase-line"/>
  <line x1="188" y1="761" x2="352" y2="707" class="phase-line"/>
  <line x1="1017" y1="707" x2="861" y2="649" class="phase-line"/>

  <g class="outer-pill control" data-key="outer-control">
    <ellipse cx="109" cy="136" rx="82" ry="23" fill="var(--control)"/>
    <text x="109" y="136">en CONTRÔLE</text>
  </g>
  <g class="outer-pill control" data-key="outer-control">
    <ellipse cx="1107" cy="150" rx="82" ry="23" fill="var(--control)"/>
    <text x="1107" y="150">en CONTRÔLE</text>
  </g>
  <g class="outer-pill control" data-key="outer-control">
    <ellipse cx="106" cy="761" rx="82" ry="23" fill="var(--control)"/>
    <text x="106" y="761">en CONTRÔLE</text>
  </g>
  <g class="outer-pill control" data-key="outer-control">
    <ellipse cx="1106" cy="707" rx="82" ry="23" fill="var(--control)"/>
    <text x="1106" y="707">en CONTRÔLE</text>
  </g>
</g>

<!-- Cercle blanc des causes -->
<circle cx="600" cy="452" r="165" class="cause-ring"/>

<!-- Étape 1 : causes avec mise en page plus équilibrée -->
<g data-step="1">
  <!-- petites lignes de séparation -->
  <line x1="553" y1="405" x2="505" y2="357" class="cause-sep"/>
  <line x1="647" y1="405" x2="695" y2="357" class="cause-sep"/>
  <line x1="553" y1="499" x2="505" y2="547" class="cause-sep"/>
  <line x1="647" y1="499" x2="695" y2="547" class="cause-sep"/>

  <!-- zone haute -->
  <g class="cause-item" data-key="env">
    <path class="cause-hit" d="M600 287 L695 357 L647 405 L553 405 L505 357 Z"/>
    <text x="600" y="338" class="cause-text">Environnement</text>
    <text x="600" y="372" class="cause-text">Stress</text>
  </g>

  <!-- zone gauche -->
  <g class="cause-item" data-key="routine">
    <path class="cause-hit" d="M435 452 L505 357 L553 405 L553 499 L505 547 Z"/>
    <g transform="rotate(-90 488 452)">
      <text x="488" y="421" class="cause-text small">Routine</text>
      <text x="488" y="452" class="cause-text">Psychologique</text>
      <text x="488" y="483" class="cause-text">Physique</text>
    </g>
  </g>

  <!-- zone droite -->
  <g class="cause-item" data-key="imp">
    <path class="cause-hit" d="M765 452 L695 357 L647 405 L647 499 L695 547 Z"/>
    <g transform="rotate(90 712 452)">
      <text x="712" y="421" class="cause-text small">Impulsivité</text>
      <text x="712" y="452" class="cause-text">Frustration</text>
      <text x="712" y="483" class="cause-text">Colère</text>
    </g>
  </g>

  <!-- zone basse : remontée et plus compacte -->
  <g class="cause-item" data-key="med">
    <path class="cause-hit" d="M600 617 L695 547 L647 499 L553 499 L505 547 Z"/>
    <text x="600" y="532" class="cause-text">Médical</text>
    <text x="600" y="554" class="cause-text">Santé mentale</text>
    <text x="600" y="576" class="cause-text">Neurologique</text>
    <text x="600" y="598" class="cause-text">Traumatisme</text>
  </g>
</g>

<!-- Étape 2 -->
<g class="center-step" data-step="2" data-key="centre-anx">
  <ellipse cx="600" cy="452" rx="67" ry="61" fill="#808080"/>
  <text x="600" y="452">ANXIÉTÉ</text>
</g>

<!-- Étape 4 : comportements d'agression -->
<g class="bubble" data-step="4" data-key="panic">
  <ellipse cx="505" cy="190" rx="77" ry="37" fill="#ef3325"/>
  <text x="505" y="182">
    <tspan x="505">en État de</tspan><tspan x="505" dy="20">PANIQUE</tspan>
  </text>
</g>

<g class="bubble" data-step="4" data-key="acting">
  <ellipse cx="748" cy="195" rx="96" ry="39" fill="#d93842"/>
  <text x="748" y="187">
    <tspan x="748">En ACTING-OUT</tspan><tspan x="748" dy="20">gens ou matériel</tspan>
  </text>
</g>

<g class="bubble" data-step="4" data-key="actingin">
  <ellipse cx="858" cy="338" rx="91" ry="87" fill="#f58a62"/>
  <text x="858" y="296">
    <tspan x="858">Tentative de</tspan>
    <tspan x="858" dy="20">suicide</tspan>
    <tspan x="858" dy="23">en ACTING-IN</tspan>
    <tspan x="858" dy="22" font-size="13">Automutilation</tspan>
    <tspan x="858" dy="19" font-size="13">Conduite à risque</tspan>
  </text>
</g>

<g class="bubble" data-step="4" data-key="prov">
  <ellipse cx="387" cy="286" rx="83" ry="31" fill="#ff7e17"/>
  <text x="387" y="286">en PROVOCATION</text>
</g>

<g class="bubble yellow" data-step="4" data-key="opp">
  <ellipse cx="338" cy="374" rx="58" ry="31" fill="#ecc91c"/>
  <text x="338" y="374">OPPOSITION</text>
</g>

<g class="bubble" data-step="4" data-key="symb">
  <ellipse cx="305" cy="482" rx="76" ry="43" fill="#15933a"/>
  <text x="305" y="471">
    <tspan x="305">AGRESSIONS</tspan><tspan x="305" dy="22">SYMBOLIQUES</tspan>
  </text>
</g>

<g class="bubble" data-step="4" data-key="pert">
  <ellipse cx="329" cy="579" rx="84" ry="42" fill="#1e9840"/>
  <text x="329" y="568">
    <tspan x="329">COMPORTEMENTS</tspan><tspan x="329" dy="22">PERTURBATEURS</tspan>
  </text>
</g>

<g class="bubble" data-step="4" data-key="activation">
  <ellipse cx="474" cy="655" rx="59" ry="38" fill="#009900"/>
  <text x="474" y="646">
    <tspan x="474">en</tspan><tspan x="474" dy="21">ACTIVATION</tspan>
  </text>
</g>

<!-- Étape 3 -->
<g class="bubble" data-step="3" data-key="anxiety">
  <ellipse cx="485" cy="741" rx="108" ry="33" fill="#0a9f19"/>
  <text x="485" y="732">
    <tspan x="485">COMPORTEMENTS</tspan>
    <tspan x="485" dy="20">DÛ À UN ÉTAT D'ANXIÉTÉ</tspan>
  </text>
</g>

<!-- Étape 5 -->
<g class="bubble" data-step="5" data-key="recovery">
  <ellipse cx="810" cy="584" rx="90" ry="55" fill="#7ba1c9"/>
  <text x="810" y="574">
    <tspan x="810">en</tspan><tspan x="810" dy="22">RÉCUPÉRATION</tspan>
  </text>
</g>

</svg>
</div>

<div class="steps-dock" id="stepsDock">
  <button class="steps-toggle" id="stepsToggle" type="button" aria-expanded="false" aria-controls="stepsPanel" title="Afficher les étapes">
    Les 6 étapes<br>d’une crise
  </button>

  <div class="step-panel" id="stepsPanel" aria-label="Sélection des 6 étapes">
    <h3>Étapes</h3>
    <div class="step-sub">Afficher ou masquer les éléments</div>
    <button class="step-btn" data-toggle-step="1"><span class="step-num">1</span><span class="step-label">Causes</span></button>
    <button class="step-btn" data-toggle-step="2"><span class="step-num">2</span><span class="step-label">Anxiété</span></button>
    <button class="step-btn" data-toggle-step="3"><span class="step-num">3</span><span class="step-label">État d’anxiété</span></button>
    <button class="step-btn" data-toggle-step="4" title="Comportements d’agression"><span class="step-num">4</span><span class="step-label">Comportements d’agression</span></button>
    <button class="step-btn" data-toggle-step="5"><span class="step-num">5</span><span class="step-label">Récupération</span></button>
    <button class="step-btn" data-toggle-step="6"><span class="step-num">6</span><span class="step-label">Contrôle</span></button>
  </div>
</div>

<div class="fullscreen-wrap">
  <button class="fs-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Plein écran" aria-label="Plein écran">⛶</button>
</div>

<dialog id="detailDialog">
  <div class="dialog-head">
    <div>
      <h2 id="dialogTitle">Élément</h2>
    </div>
    <button class="close" aria-label="Fermer" onclick="detailDialog.close()">×</button>
  </div>
  <div class="dialog-body" id="dialogBody"></div>
</dialog>

<script>
const detailDialog=document.getElementById('detailDialog');
const screenEl=document.querySelector('.screen');
const fullscreenBtn=document.getElementById('fullscreenBtn');

const details={
  "centre-anx":{
    title:"Anxiété",
    intro:"L’anxiété est présentée comme un état affectif marqué par un sentiment d’insécurité, souvent accompagné de modifications physiques ou neurovégétatives. La personne demeure généralement encore réceptive et peut parfois parler de sa souffrance ou de la situation anxiogène.",
    observe:[
      "Indicateurs physiques et psychologiques propres à la personne",
      "Malaise, inquiétude, peur ou anticipation du pire",
      "Rigidité accrue pour rendre les événements plus prévisibles",
      "Réactions de type figer, foncer ou fuir",
      "Signes précurseurs parfois discrets, mais présents avant l’escalade"
    ],
    understand:"À ce niveau, la communication peut encore être très efficace. C’est donc un moment privilégié pour reconnaître le malaise, comprendre ce qui se passe et intervenir avant que l’activation augmente.",
    questions:[
      "Qu’est-ce qui semble insécurisant ou anxiogène ici et maintenant?",
      "Y a-t-il un changement, une surcharge, une douleur, une frustration ou un besoin non satisfait?",
      "Quels signes précurseurs sont habituels chez cette personne?",
      "Quels mots, gestes, sons, odeurs ou repères sont habituellement apaisants ou, au contraire, activants?"
    ],
    intervene:[
      "Reconnaître le malaise ou la souffrance.",
      "Chercher les causes possibles.",
      "Vérifier ce qui ne va pas ou convenir d’un moment pour en reparler si ce n’est pas possible immédiatement.",
      "Favoriser la communication et la compréhension quand la personne est disponible.",
      "Proposer différents moyens pour diminuer l’anxiété.",
      "Offrir de l’encadrement, une structure et une routine prévisible.",
      "Utiliser le moyen de communication le plus fonctionnel pour la personne.",
      "Créer et maintenir un lien de confiance.",
      "Utiliser des outils d’observation et d’analyse pour mieux comprendre les déclencheurs et les signes précurseurs.",
      "Préparer la personne aux changements et lui donner des repères pour y faire face.",
      "Utiliser, dans certaines situations, la restructuration cognitive ou une désensibilisation graduelle.",
      "Faire un aménagement préventif de l’environnement, statique ou dynamique.",
      "Développer la qualité de vie et utiliser une approche positive.",

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function listCard(title,items,extraClass=''){
  if(!items || !items.length) return '';
  return `<section class="detail-card ${extraClass}">
    <h3>${esc(title)}</h3>
    <ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </section>`;
}
function textCard(title,text,extraClass=''){
  if(!text) return '';
  return `<section class="detail-card ${extraClass}">
    <h3>${esc(title)}</h3>
    <p>${esc(text)}</p>
  </section>`;
}
function openDetail(key){
  const d=details[key]; if(!d) return;
  const note = detailNoteStyles[key] || {accent:"#8c8c8c", bg:"#fffdf4", border:"#d8d3c5"};

  detailDialog.style.setProperty('--note-accent', note.accent);
  detailDialog.style.setProperty('--note-bg', note.bg);
  detailDialog.style.setProperty('--note-border', note.border);

  document.getElementById('dialogTitle').textContent=d.title;

  let body='';
  body += '<div class="detail-kicker">Définition</div>';
  if(d.intro) body+=`<p class="detail-intro">${esc(d.intro)}</p>`;

  body+='<div class="detail-grid">';
  body+=listCard('Ce qu’on observe',d.observe);
  body+=textCard('À comprendre',d.understand);
  body+=listCard('Questions à se poser',d.questions,'questions');
  body+=listCard('Comment intervenir',d.intervene);
  body+=listCard('Moyens / exemples',d.means);
  body+=listCard('Sécurité',d.safety,'questions');
  body+=listCard('À éviter',d.avoid,'avoid');
  body+='</div>';

  document.getElementById('dialogBody').innerHTML=body;
  detailDialog.showModal();
}
document.querySelectorAll('[data-key]').forEach(el=>{
  el.addEventListener('click',()=>openDetail(el.dataset.key));
});

// Hover SVG robuste : agrandissement progressif à 150 % sur 3 secondes.
const hoverAnimations = new WeakMap();

function animateSvgScale(el, targetScale, duration){
  const previous = hoverAnimations.get(el);
  if(previous) cancelAnimationFrame(previous.raf);

  let bbox;
  try { bbox = el.getBBox(); } catch(e) { return; }
  const cx = bbox.x + bbox.width / 2;
  const cy = bbox.y + bbox.height / 2;

  const current = Number(el.dataset.hoverScale || 1);
  const start = performance.now();

  function frame(now){
    const p = Math.min(1, (now - start) / duration);
    // ease-in-out très doux
    const eased = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    const s = current + (targetScale - current) * eased;

    el.setAttribute(
      'transform',
      `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`
    );
    el.dataset.hoverScale = String(s);

    if(p < 1){
      const raf = requestAnimationFrame(frame);
      hoverAnimations.set(el, {raf});
    }else{
      el.dataset.hoverScale = String(targetScale);
      hoverAnimations.delete(el);
      if(targetScale === 1) el.removeAttribute('transform');
    }
  }

  const raf = requestAnimationFrame(frame);
  hoverAnimations.set(el, {raf});
}

document.querySelectorAll('.bubble, .cause-item, .center-step, .outer-pill').forEach(el=>{
  el.dataset.hoverScale = '1';

  el.addEventListener('mouseenter',()=>{
    animateSvgScale(el, 1.5, 3000);
  });

  el.addEventListener('mouseleave',()=>{
    animateSvgScale(el, 1, 450);
  });
});

const stepState={1:true,2:true,3:true,4:true,5:true,6:true};
function applyStepState(step){
  document.querySelectorAll('[data-step="'+step+'"]').forEach(el=>{
    el.classList.toggle('hidden',!stepState[step]);
  });
  const btn=document.querySelector('.step-btn[data-toggle-step="'+step+'"]');
  if(btn) btn.classList.toggle('off',!stepState[step]);
}
document.querySelectorAll('.step-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const step=btn.dataset.toggleStep;
    stepState[step]=!stepState[step];
    applyStepState(step);
  });
});
Object.keys(stepState).forEach(applyStepState);

// Colonne des étapes : fermée par défaut
const stepsDock=document.getElementById('stepsDock');
const stepsToggle=document.getElementById('stepsToggle');

function setStepsOpen(open){
  stepsDock.classList.toggle('open',open);
  stepsToggle.setAttribute('aria-expanded',String(open));
  stepsToggle.title=open?'Masquer « Les 6 étapes d’une crise »':'Afficher « Les 6 étapes d’une crise »';
}
stepsToggle.addEventListener('click',()=>{
  setStepsOpen(!stepsDock.classList.contains('open'));
});
setStepsOpen(false);

async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){await screenEl.requestFullscreen();}
    else{await document.exitFullscreen();}
  }catch(e){}
}
function updateFullscreenButton(){
  fullscreenBtn.textContent=document.fullscreenElement?'⤢':'⛶';
  fullscreenBtn.title=document.fullscreenElement?'Quitter le plein écran':'Plein écran';
  fullscreenBtn.setAttribute('aria-label',fullscreenBtn.title);
}
document.addEventListener('fullscreenchange',updateFullscreenButton);
