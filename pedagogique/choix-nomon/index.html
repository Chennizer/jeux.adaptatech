<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choix de vidéos avec horloges Nomon</title>
  <link rel="stylesheet" href="../../css/choix-nomon.css">
</head>
<body>
  <main id="nomon-app">
    <header class="nomon-header">
      <div>
        <p class="eyebrow">Prototype non répertorié</p>
        <h1>Choix de vidéos avec horloges Nomon</h1>
        <p id="instructions">Regardez l’horloge de la vidéo souhaitée, puis appuyez sur votre switch lorsque son aiguille pointe vers le haut.</p>
      </div>
      <div class="controls" aria-label="Réglages">
        <label for="rotation-speed">Durée d’un tour</label>
        <select id="rotation-speed">
          <option value="6000">6 secondes</option>
          <option value="8000" selected>8 secondes</option>
          <option value="10000">10 secondes</option>
          <option value="12000">12 secondes</option>
        </select>
        <button id="pause-clocks" type="button">Pause</button>
      </div>
    </header>

    <section id="video-grid" aria-label="Douze choix de vidéos"></section>

    <footer class="switch-help">
      <kbd>Espace</kbd> ou un clic de switch sélectionne l’horloge la plus près de midi.
      <span id="status" role="status" aria-live="polite"></span>
    </footer>
  </main>

  <div id="video-container" hidden>
    <video id="video-player" playsinline></video>
    <button id="close-video" type="button" aria-label="Fermer la vidéo">×</button>
    <p>Appuyez sur le switch pour retourner aux choix</p>
  </div>

  <script src="../../js/choiceArray.js"></script>
  <script src="../../js/choix-nomon.js"></script>
</body>
</html>
