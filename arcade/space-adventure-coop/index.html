<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Space Adventure Multijoueur</title>
  <script>
    const game = new URL('/arcade/space-invaders-fruits/', location.href);
    game.search = location.search;
    game.searchParams.set('mode', 'multiplayer');
    location.replace(game);
  </script>
</head>
<body>
  <a href="/arcade/space-invaders-fruits/?mode=multiplayer">Space Adventure Multijoueur</a>
</body>
</html>
